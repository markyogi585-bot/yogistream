<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SonyLiv Live Event Player</title>
<script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, sans-serif;
}
#player {
  width: 100vw;
  height: 100dvh;
  max-width: 100%;
  max-height: 100%;
  position: relative;
}
.error-msg {
  color: #ff4757;
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>
<div id="player"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
let videoUrl = urlParams.get('url');

if (!videoUrl) {
    document.body.innerHTML = '<h2 class="error-msg">Stream URL Missing in query params (?url=...)</h2>';
    throw new Error("No stream URL");
}

function initPlayer(streamUrl) {
    try {
        const player = jwplayer("player");
        player.setup({
            file: streamUrl,
            width: "100%",
            height: "100%",
            autostart: true,
            mute: false,
            primary: "html5",
            stretching: "uniform",
            controls: true,
            qualityLabels: false
        });

        player.on('error', function() {
            fallbackHLS(streamUrl);
        });
    } catch(err) {
        fallbackHLS(streamUrl);
    }
}

function fallbackHLS(streamUrl) {
    const playerContainer = document.getElementById('player');
    playerContainer.innerHTML = '';
    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.objectFit = 'contain';
    playerContainer.appendChild(video);

    if (Hls.isSupported()) {
        const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(() => {});
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(() => {});
    }
}

initPlayer(videoUrl);
</script>
<script src="../assets/security.js"></script>
</body>
</html>
