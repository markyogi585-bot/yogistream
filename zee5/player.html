<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YogiStream - Zee5 Live TV | @yogiprojects</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: #fff;
        }
        .video-container {
            width: 100vw;
            height: 100dvh;
            position: relative;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* Top Header */
        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1rem;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: #800080;
            color: #fff;
            transform: scale(1.05);
        }
        .channel-title-text {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .channel-badge {
            background: linear-gradient(90deg, #9900ee, #ff0077);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(153, 0, 238, 0.25);
            border: 1px solid rgba(153, 0, 238, 0.5);
            color: #d170ff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background: #d170ff;
            border-radius: 50%;
            animation: pulseDot 1.2s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
        }
        .error-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.88);
            color: #ff5555;
            padding: 20px;
            text-align: center;
            z-index: 100;
        }
        .error-overlay button {
            margin-top: 15px;
            padding: 10px 24px;
            border-radius: 30px;
            background: linear-gradient(90deg, #9900ee, #ff0077);
            color: #fff;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-header">
      <div class="header-left">
        <a href="index.html" class="back-btn" title="Back to Channels">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div>
          <div id="channelTitle" class="channel-title-text">Zee5 Live TV</div>
          <span class="channel-badge">CLEARKEY DRM</span>
        </div>
      </div>
      <div class="header-right">
        <div class="live-indicator">
          <div class="live-dot"></div>
          <span>LIVE</span>
        </div>
      </div>
    </div>

    <div class="video-container" id="player-container" data-shaka-player-container>
        <video id="video" autoplay playsinline data-shaka-player></video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mpdUrl = urlParams.get('mpd');
        const keyId = urlParams.get('keyid');
        const key = urlParams.get('key');
        const title = urlParams.get('title') || 'Zee5 Live Stream';

        document.getElementById('channelTitle').textContent = title;
        document.title = title + ' - YogiStream Live';

        async function initApp() {
            if (!mpdUrl) {
                showError("Stream URL Missing", "No DASH MPD stream specified in parameters.");
                return;
            }

            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
                showError("Unsupported Browser", "Your browser does not support Shaka Player.");
                return;
            }

            const video = document.getElementById('video');
            const container = document.getElementById('player-container');
            const player = new shaka.Player();
            await player.attach(video);

            const ui = new shaka.ui.Overlay(player, container, video);
            ui.configure({
                controlPanelElements: [
                    'play_pause',
                    'time_and_duration',
                    'mute',
                    'volume',
                    'spacer',
                    'quality',
                    'picture_in_picture',
                    'fullscreen'
                ],
                seekBarColors: {
                    base: 'rgba(255,255,255,.2)',
                    buffered: 'rgba(255,255,255,.4)',
                    played: 'rgb(209,112,255)'
                }
            });

            const drmConfig = {};
            if (keyId && key) {
                drmConfig.clearKeys = {};
                drmConfig.clearKeys[keyId] = key;
            }

            player.configure({
                drm: drmConfig,
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 20,
                    rebufferingGoal: 4
                }
            });

            try {
                await player.load(mpdUrl);
                video.play().catch(() => {});
            } catch (e) {
                console.error('Error loading stream', e);
                showError("Stream Playback Error", e.message || "Failed to decode or play DASH ClearKey stream.");
            }
        }

        function showError(title, msg) {
            const container = document.getElementById('player-container');
            container.innerHTML = `
                <div class="error-overlay">
                    <h2>⚠️ ${title}</h2>
                    <p style="margin-top:8px; color:#ccc;">${msg}</p>
                    <button onclick="window.history.back()">Go Back</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
    <script src="../assets/security.js"></script>
</body>
</html>
