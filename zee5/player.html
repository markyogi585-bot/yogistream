<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YogiStream - Cinema Pro Player | @yogiprojects</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            color: #fff;
        }

        /* Ambient Glow Backdrop */
        .ambient-glow {
            position: absolute;
            inset: -40px;
            background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.25), transparent 70%);
            filter: blur(50px);
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s;
        }

        .shaka-video-container {
            width: 100vw;
            height: 100dvh;
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 5;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: object-fit 0.2s;
        }

        /* Top Header */
        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 25;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .back-btn {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: #a855f7;
            color: #000;
            transform: scale(1.08);
        }
        .channel-title-text {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        .channel-badge {
            background: linear-gradient(90deg, #9900ee, #ff0077);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }
        .player-tool-btn {
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .player-tool-btn:hover {
            background: #a855f7;
            color: #000;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(153, 0, 238, 0.25);
            border: 1px solid rgba(153, 0, 238, 0.5);
            color: #d170ff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            background: #d170ff;
            border-radius: 50%;
            animation: pulseDot 1.2s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* In-Player Channel Drawer Modal */
        .channel-drawer {
            position: fixed;
            top: 0;
            right: -360px;
            width: 340px;
            height: 100vh;
            background: rgba(10, 13, 24, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -15px 0 40px rgba(0,0,0,0.8);
        }
        .channel-drawer.open { right: 0; }
        .drawer-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .drawer-title { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 800; }
        .drawer-close {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .drawer-search {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 8px 14px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            margin-bottom: 14px;
        }
        .drawer-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .drawer-list::-webkit-scrollbar { width: 4px; }
        .drawer-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
        .drawer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            color: #fff;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            transition: all 0.2s;
        }
        .drawer-item:hover {
            background: rgba(168, 85, 247, 0.2);
            border-left: 3px solid #a855f7;
            padding-left: 12px;
        }
        .drawer-logo {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: contain;
            background: rgba(0,0,0,0.5);
            padding: 2px;
        }

        .unmute-banner {
          position: absolute;
          bottom: 80px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0,0,0,0.85);
          border: 1px solid rgba(209, 112, 255, 0.4);
          color: #fff;
          padding: 10px 22px;
          border-radius: 30px;
          font-size: 0.9rem;
          font-weight: 700;
          display: flex;
          align-items: center;
          gap: 10px;
          z-index: 25;
          cursor: pointer;
          backdrop-filter: blur(8px);
          box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .unmute-banner.hidden { display: none; }
    </style>
</head>
<body>

    <div class="ambient-glow" id="ambientGlow"></div>

    <div class="player-header">
      <div class="header-left">
        <a href="index.html" class="back-btn" title="Back to Channels">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div>
          <div id="channelTitle" class="channel-title-text">Zee5 Live TV</div>
          <span class="channel-badge">CLEARKEY 1080P</span>
        </div>
      </div>
      <div class="header-right">
        <button class="player-tool-btn" onclick="cycleAspectRatio()" title="Aspect Ratio (Key: A)"><i class="fas fa-expand"></i> <span id="aspectLabel">FIT</span></button>
        <button class="player-tool-btn" onclick="togglePiP()" title="Picture in Picture (Key: P)"><i class="fas fa-clone"></i> PiP</button>
        <button class="player-tool-btn" onclick="toggleChannelDrawer()" title="Channel List (Key: C)"><i class="fas fa-list"></i> Channels</button>
        <div class="live-indicator">
          <div class="live-dot"></div>
          <span>LIVE</span>
        </div>
      </div>
    </div>

    <!-- Quick In-Player Channel Drawer -->
    <div class="channel-drawer" id="channelDrawer">
      <div class="drawer-head">
        <div class="drawer-title"><i class="fas fa-tv" style="color:#a855f7;"></i> Quick Switch</div>
        <button class="drawer-close" onclick="toggleChannelDrawer()"><i class="fas fa-times"></i></button>
      </div>
      <input type="text" class="drawer-search" id="drawerSearch" placeholder="Search channels..." oninput="filterDrawerChannels()">
      <div class="drawer-list" id="drawerList"></div>
    </div>

    <div class="unmute-banner hidden" id="unmuteBanner" onclick="enableAudio()">
      <i class="fas fa-volume-up"></i>
      <span>Click to Unmute Audio</span>
    </div>

    <div class="shaka-video-container" id="player-container" data-shaka-player data-shaka-controls>
        <video id="video" autoplay playsinline preload="auto"></video>
    </div>

    <script>
        let globalVideo = document.getElementById('video');
        let drawerChannels = [];
        const aspectRatios = ['contain', 'cover', 'fill', 'none'];
        const aspectLabels = ['FIT', 'COVER', 'FILL', 'STRETCH'];
        let aspectIdx = 0;

        function cycleAspectRatio() {
          aspectIdx = (aspectIdx + 1) % aspectRatios.length;
          globalVideo.style.objectFit = aspectRatios[aspectIdx];
          document.getElementById('aspectLabel').textContent = aspectLabels[aspectIdx];
        }

        async function togglePiP() {
          try {
            if (document.pictureInPictureElement) {
              await document.exitPictureInPicture();
            } else if (document.pictureInPictureEnabled) {
              await globalVideo.requestPictureInPicture();
            }
          } catch (e) {}
        }

        function toggleChannelDrawer() {
          const d = document.getElementById('channelDrawer');
          d.classList.toggle('open');
          if (d.classList.contains('open') && drawerChannels.length === 0) {
            loadDrawerChannels();
          }
        }

        async function loadDrawerChannels() {
          try {
            const r = await fetch('channels199.json');
            if (r.ok) {
              const data = await r.json();
              drawerChannels = data.channels || [];
              renderDrawerList(drawerChannels);
            }
          } catch(e) {}
        }

        function renderDrawerList(list) {
          const c = document.getElementById('drawerList');
          c.innerHTML = list.map(ch => {
            const keyId = ch.clearkey?.keyId || '';
            const key = ch.clearkey?.key || '';
            const url = `player.html?mpd=${encodeURIComponent(ch.mpd)}&keyid=${encodeURIComponent(keyId)}&key=${encodeURIComponent(key)}&title=${encodeURIComponent(ch.name)}`;
            return `
              <a href="${url}" class="drawer-item">
                <img src="${ch.logo}" onerror="this.src='../assets/zee5.jpg'" class="drawer-logo" alt="${ch.name}">
                <span>${ch.name}</span>
              </a>
            `;
          }).join('');
        }

        function filterDrawerChannels() {
          const q = (document.getElementById('drawerSearch')?.value || '').toLowerCase().trim();
          const filtered = drawerChannels.filter(c => c.name.toLowerCase().includes(q));
          renderDrawerList(filtered);
        }

        function enableAudio() {
          if (globalVideo) {
            globalVideo.muted = false;
            globalVideo.volume = 1.0;
          }
          const banner = document.getElementById('unmuteBanner');
          if (banner) banner.classList.add('hidden');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const mpdUrl = urlParams.get('mpd');
        const keyId = urlParams.get('keyid');
        const key = urlParams.get('key');
        const title = urlParams.get('title') || 'Zee5 Live Stream';

        document.getElementById('channelTitle').textContent = title;
        document.title = title + ' - YogiStream Live';

        async function initApp() {
            if (!mpdUrl) return;

            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) return;

            const video = document.getElementById('video');
            globalVideo = video;
            
            video.muted = false;
            video.volume = 1.0;

            const container = document.getElementById('player-container');
            const player = new shaka.Player();
            await player.attach(video);

            const ui = new shaka.ui.Overlay(player, container, video);
            ui.configure({
                controlPanelElements: [
                    'play_pause',
                    'time_and_duration',
                    'volume',
                    'spacer',
                    'quality',
                    'fullscreen'
                ],
                seekBarColors: {
                    base: 'rgba(255,255,255,.2)',
                    buffered: 'rgba(255,255,255,.4)',
                    played: 'rgb(209,112,255)'
                }
            });

            const drmConfig = {};
            if (keyId && key) {
                drmConfig.clearKeys = {};
                drmConfig.clearKeys[keyId] = key;
            }

            player.configure({
                drm: drmConfig,
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 2,
                    rebufferingGoal: 0.5
                }
            });

            try {
                await player.load(mpdUrl);
                video.play().catch(() => {
                  video.muted = true;
                  video.play().catch(() => {});
                  const banner = document.getElementById('unmuteBanner');
                  if (banner) banner.classList.remove('hidden');
                });
            } catch (e) {
                console.warn('Player load error:', e);
            }
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'INPUT') return;
          if (e.key === ' ' || e.key === 'k') {
            globalVideo.paused ? globalVideo.play() : globalVideo.pause();
            e.preventDefault();
          } else if (e.key === 'f' || e.key === 'F') {
            document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
          } else if (e.key === 'm' || e.key === 'M') {
            globalVideo.muted = !globalVideo.muted;
          } else if (e.key === 'a' || e.key === 'A') {
            cycleAspectRatio();
          } else if (e.key === 'p' || e.key === 'P') {
            togglePiP();
          } else if (e.key === 'c' || e.key === 'C') {
            toggleChannelDrawer();
          }
        });

        document.addEventListener('DOMContentLoaded', initApp);
        document.addEventListener('click', () => { enableAudio(); }, { once: true });
    </script>
    <script src="../assets/security.js"></script>
</body>
</html>
