<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Allinone Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    overscroll-behavior:none;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    width:100vw;
    height:100dvh;
}


/* =========================================================
   PLAYER
========================================================= */

#player{
    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100dvh;

    min-height:100svh;

    background:#000;

    overflow:hidden;

    touch-action:manipulation;
}


/* =========================================================
   VIDEO
========================================================= */

#video{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;

    object-fit:contain;

    max-width:100%;
    max-height:100%;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:70px;

    padding:
        max(15px,env(safe-area-inset-top))
        max(18px,env(safe-area-inset-right))
        15px
        max(18px,env(safe-area-inset-left));

    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.85),
            rgba(0,0,0,0)
        );

    z-index:20;

    opacity:0;

    transition:opacity .25s;

    pointer-events:none;
}

#player.show-ui .topbar{
    opacity:1;
}

.title{

    color:#fff;

    font-size:16px;

    font-weight:600;

    max-width:70%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.live{

    display:flex;

    align-items:center;

    gap:7px;

    background:#e50914;

    color:#fff;

    padding:6px 10px;

    border-radius:5px;

    font-size:11px;

    font-weight:bold;
}

.live-dot{

    width:7px;
    height:7px;

    background:#fff;

    border-radius:50%;

    animation:blink 1s infinite;
}

@keyframes blink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.25;
    }

}


/* =========================================================
   CENTER PLAY
========================================================= */

.center-play{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:72px;
    height:72px;

    border-radius:50%;

    border:0;

    background:
        rgba(255,255,255,.95);

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:25;

    transition:.2s;

    pointer-events:auto;
}

.center-play:hover{

    transform:
        translate(-50%,-50%)
        scale(1.08);

}

.center-play svg{

    width:30px;
    height:30px;

    fill:#111;

}

.center-play.hidden{

    opacity:0;

    pointer-events:none;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    z-index:30;

    text-align:center;

    color:#fff;

    display:none;

    pointer-events:none;
}

.spinner{

    width:48px;
    height:48px;

    border:
        4px solid
        rgba(255,255,255,.25);

    border-top-color:#fff;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

    margin:
        auto auto 12px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.loading-text{

    font-size:13px;

    color:#ddd;

}


/* =========================================================
   ERROR
========================================================= */

.error{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:min(90%,420px);

    padding:25px;

    background:
        rgba(15,15,15,.96);

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:12px;

    color:#fff;

    text-align:center;

    z-index:50;

    display:none;
}

.error h3{

    font-size:18px;

    margin-bottom:8px;

}

.error p{

    color:#aaa;

    font-size:13px;

    line-height:1.5;

}

.retry{

    margin-top:17px;

    border:0;

    padding:10px 20px;

    border-radius:6px;

    background:#fff;

    color:#111;

    font-weight:bold;

    cursor:pointer;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:
        10px
        max(18px,env(safe-area-inset-right))
        max(15px,env(safe-area-inset-bottom))
        max(18px,env(safe-area-inset-left));

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.95),
            rgba(0,0,0,0)
        );

    z-index:20;

    opacity:0;

    transition:opacity .25s;

    pointer-events:none;
}

#player.show-ui .controls{

    opacity:1;

    pointer-events:auto;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap{

    width:100%;

    height:5px;

    margin-bottom:10px;

    cursor:pointer;

    position:relative;
}

.progress{

    position:absolute;

    left:0;
    top:1px;

    width:100%;
    height:4px;

    background:
        rgba(255,255,255,.25);

    border-radius:5px;
}

.progress-fill{

    height:100%;

    width:100%;

    background:#e50914;

    border-radius:5px;
}


/* =========================================================
   CONTROL ROW
========================================================= */

.control-row{

    display:flex;

    align-items:center;

    gap:10px;

    min-height:38px;
}

.control-btn{

    width:34px;
    height:34px;

    border:0;

    background:transparent;

    color:#fff;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:5px;

    touch-action:manipulation;
}

.control-btn:hover{

    background:
        rgba(255,255,255,.12);

}

.control-btn svg{

    width:21px;
    height:21px;

    fill:#fff;

}


/* =========================================================
   VOLUME
========================================================= */

.volume-box{

    display:flex;

    align-items:center;

    gap:5px;

}

.volume-slider{

    width:80px;

    height:4px;

    cursor:pointer;

}


/* =========================================================
   SPACER
========================================================= */

.spacer{
    flex:1;
}


/* =========================================================
   LIVE TEXT
========================================================= */

.live-text{

    color:#fff;

    font-size:11px;

    padding-left:4px;

    font-weight:bold;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .topbar{

        height:55px;

        padding-top:
            max(
                10px,
                env(safe-area-inset-top)
            );

    }

    .title{

        font-size:13px;

    }

    .controls{

        padding-left:
            max(
                8px,
                env(safe-area-inset-left)
            );

        padding-right:
            max(
                8px,
                env(safe-area-inset-right)
            );

        padding-bottom:
            max(
                10px,
                env(safe-area-inset-bottom)
            );

    }

    .control-row{
        gap:4px;
    }

    .control-btn{

        width:32px;
        height:32px;

    }

    .volume-slider{

        width:55px;

    }

    .live-text{

        font-size:10px;

    }

    .center-play{

        width:60px;
        height:60px;

    }

    .center-play svg{

        width:25px;
        height:25px;

    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:380px){

    .volume-slider{
        display:none;
    }

    .live-text{
        display:none;
    }

    .control-row{
        gap:2px;
    }

}


/* =========================================================
   LANDSCAPE
========================================================= */

@media(
    max-width:900px
) and (
    orientation:landscape
){

    .topbar{

        height:50px;

        padding-top:
            max(
                8px,
                env(safe-area-inset-top)
            );

    }

    .controls{

        padding-top:6px;

        padding-bottom:
            max(
                7px,
                env(safe-area-inset-bottom)
            );

    }

    .progress-wrap{

        margin-bottom:5px;

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

#player:fullscreen{

    width:100vw;
    height:100vh;

}

#player:-webkit-full-screen{

    width:100vw;
    height:100vh;

}

</style>

<body>

<div id="player">


    <!-- VIDEO -->

    <video
        id="video"
        playsinline
        webkit-playsinline
        preload="auto"
        autoplay
        muted>
    </video>


    <!-- TOP -->

    <div class="topbar">

        <div
            id="channelTitle"
            class="title">

            Allinone Reborn

        </div>

        <div class="live">

            <span class="live-dot"></span>

            LIVE

        </div>

    </div>


    <!-- CENTER PLAY -->

    <button
        id="centerPlay"
        class="center-play">

        <svg viewBox="0 0 24 24">

            <path d="M8 5v14l11-7z"/>

        </svg>

    </button>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading">

        <div class="spinner"></div>

        <div
            id="loadingText"
            class="loading-text">

            Connecting...

        </div>

    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="error">

        <h3>
            Stream Error
        </h3>

        <p id="errorText">
            Unable to load live stream.
        </p>

        <button
            class="retry"
            onclick="startPlayer()">

            Retry

        </button>

    </div>


    <!-- CONTROLS -->

    <div class="controls">


        <div
            id="progressWrap"
            class="progress-wrap">

            <div class="progress">

                <div
                    id="progressFill"
                    class="progress-fill">
                </div>

            </div>

        </div>


        <div class="control-row">


            <!-- PLAY -->

            <button
                id="playBtn"
                class="control-btn"
                title="Play / Pause">

                <svg
                    id="playIcon"
                    viewBox="0 0 24 24">

                    <path
                        d="M8 5v14l11-7z"/>

                </svg>

            </button>


            <!-- VOLUME -->

            <div class="volume-box">

                <button
                    id="muteBtn"
                    class="control-btn"
                    title="Mute">

                    <svg viewBox="0 0 24 24">

                        <path d="
                        M3 9v6h4l5 5V4L7 9H3z
                        M16.5 12
                        c0-1.77-1.02-3.29-2.5-4.03v8.05
                        c1.48-.74 2.5-2.26 2.5-4.02z
                        "/>

                    </svg>

                </button>

                <input
                    id="volume"
                    class="volume-slider"
                    type="range"
                    min="0"
                    max="1"
                    step=".01"
                    value=".8">

            </div>


            <span class="live-text">
                LIVE
            </span>


            <div class="spacer"></div>


            <!-- PIP -->

            <button
                id="pipBtn"
                class="control-btn"
                title="Picture in Picture">

                <svg viewBox="0 0 24 24">

                    <path d="
                    M19 5H5c-1.1 0-2 .9-2 2v10
                    c0 1.1.9 2 2 2h14
                    c1.1 0 2-.9 2-2V7
                    c0-1.1-.9-2-2-2zm0 12H5V7h14v10zm-2-1h4v-3h-4v3z"/>

                </svg>

            </button>


            <!-- FULLSCREEN -->

            <button
                id="fullscreenBtn"
                class="control-btn"
                title="Fullscreen / Landscape">

                <svg viewBox="0 0 24 24">

                    <path d="
                    M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3z
                    M14 5v2h3v3h2V5h-5z"/>

                </svg>

            </button>

        </div>

    </div>

</div>
