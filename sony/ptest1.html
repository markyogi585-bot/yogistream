<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>YogiStream - SonyLiv Live TV | @yogiprojects</title>

<!-- Hls.js & Shaka Player Core + UI -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: #000;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  color: #fff;
}
.player-container {
  width: 100vw;
  height: 100dvh;
  position: relative;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
/* Top Header */
.player-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 16px 20px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: auto;
}
.back-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 1rem;
  backdrop-filter: blur(8px);
  transition: all 0.2s;
}
.back-btn:hover {
  background: #ff7700;
  color: #fff;
  transform: scale(1.05);
}
.channel-title-text {
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
.channel-badge {
  background: linear-gradient(90deg, #ff7700, #ff0055);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 20px;
  text-transform: uppercase;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}
.live-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 119, 0, 0.25);
  border: 1px solid rgba(255, 119, 0, 0.5);
  color: #ff9900;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}
.live-dot {
  width: 6px;
  height: 6px;
  background: #ff9900;
  border-radius: 50%;
  animation: pulseDot 1.2s infinite;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(1.3); }
}

/* Loading & Error Overlays */
.loading-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.75);
  z-index: 15;
  gap: 12px;
  pointer-events: none;
}
.loading-overlay.hidden { display: none; }
.loader-spinner {
  width: 44px;
  height: 44px;
  border: 3px solid rgba(255, 119, 0, 0.2);
  border-top-color: #ff7700;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  font-size: 0.85rem;
  color: #d1d8e6;
  font-weight: 600;
}

.error-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}
.error-modal.hidden { display: none !important; }
.error-content {
  background: #181926;
  border-radius: 24px;
  padding: 30px;
  max-width: 480px;
  width: 90%;
  text-align: center;
  color: #f0f4ff;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  border: 1px solid rgba(255, 119, 0, 0.25);
}
.error-content h3 { 
  color: #ff9900; 
  margin-bottom: 14px;
  font-size: 1.35rem;
}
.error-content p {
  font-size: 0.95rem;
  line-height: 1.5;
  margin-bottom: 1.5rem;
  color: #b2c1e0;
}
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.modal-btn {
  padding: 10px 24px;
  border-radius: 40px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  border: none;
  transition: 0.2s;
}
.modal-btn.primary {
  background: linear-gradient(90deg, #ff7700, #ff0055);
  color: #fff;
}
.modal-btn.secondary {
  background: rgba(255,255,255,0.1);
  color: #fff;
}

.shaka-video-container {
  width: 100vw;
  height: 100dvh;
  position: absolute;
  inset: 0;
}
</style>
</head>
<body>

<div class="player-header">
  <div class="header-left">
    <a href="index.html" class="back-btn" title="Back to Channels">
      <i class="fas fa-arrow-left"></i>
    </a>
    <div>
      <div id="channelTitle" class="channel-title-text">SonyLiv Live</div>
      <span class="channel-badge" id="playerBadge">HD LIVE</span>
    </div>
  </div>
  <div class="header-right">
    <div class="live-indicator">
      <div class="live-dot"></div>
      <span>LIVE</span>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loader-spinner"></div>
  <div class="loading-text" id="loadingText">Connecting to SonyLiv Stream…</div>
</div>

<div id="errorModal" class="error-modal hidden">
  <div class="error-content">
    <h3 id="errorTitle">Stream Notice</h3>
    <p id="errorMessage"></p>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="window.location.href='index.html'">Back to Channels</button>
      <button class="modal-btn primary" onclick="location.reload()">Retry Stream</button>
    </div>
  </div>
</div>

<div class="player-container" id="playerWrapper">
  <video id="videoPlayer" controls autoplay playsinline preload="auto"></video>
</div>

<script>
const SONY_JTV_MAPPING = {
  "sony-hd": { id: "291", altName: "SET HD" },
  "sab-hd": { id: "471", altName: "Sony SAB HD" },
  "sony-marathi": { id: "1146", altName: "Sony Marathi SD" },
  "sony-pal": { id: "474", altName: "Sony Pal" },
  "sony-aath": { id: "697", altName: "Sony aath" },
  "sony-yay": { id: "872", altName: "Sony Yay Hindi" },
  "sony-max-hd": { id: "476", altName: "Sony Max HD" },
  "sony-max": { id: "3418", altName: "Sony MAX1" },
  "sony-wah": { id: "1393", altName: "Sony Wah" },
  "sony-max2": { id: "483", altName: "Sony MAX2" },
  "sony-pix-hd": { id: "762", altName: "Sony Pix HD" },
  "sony-ten-1-hd": { id: "3372", altName: "Sony LIV Sports 1" },
  "sony-ten-1": { id: "3372", altName: "Sony LIV Sports 1" },
  "sony-ten-2-hd": { id: "3373", altName: "Sony LIV Sports 2" },
  "sony-ten-2": { id: "3373", altName: "Sony LIV Sports 2" },
  "sony-ten-3-hd": { id: "3374", altName: "Sony LIV Sports 3" },
  "sony-ten-3": { id: "3374", altName: "Sony LIV Sports 3" },
  "sony-ten-4-hd": { id: "3397", altName: "Sony LIV Sports 4 Tamil" },
  "sony-ten-4": { id: "3397", altName: "Sony LIV Sports 4 Tamil" },
  "sony-ten-5-hd": { id: "3399", altName: "Sony LIV Sports 5" },
  "sony-ten-5": { id: "3399", altName: "Sony LIV Sports 5" },
  "bbc-earth": { id: "821", altName: "Sony BBC Earth HD" }
};

const urlParams = new URLSearchParams(window.location.search);
const channelId = urlParams.get('id');

const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');
const errorModal = document.getElementById('errorModal');
const errorTitle = document.getElementById('errorTitle');
const errorMessage = document.getElementById('errorMessage');
const video = document.getElementById('videoPlayer');

function showLoading(msg) {
  if (loadingText) loadingText.textContent = msg || 'Connecting…';
  if (loadingOverlay) loadingOverlay.classList.remove('hidden');
}

function hideLoading() {
  if (loadingOverlay) loadingOverlay.classList.add('hidden');
}

function showError(title, msg) {
  hideLoading();
  if (errorTitle) errorTitle.textContent = title;
  if (errorMessage) errorMessage.innerHTML = msg;
  if (errorModal) errorModal.classList.remove('hidden');
}

if (!channelId) {
    showError("Channel Missing", "Channel ID missing in query params (?id=sony-hd)");
    throw new Error("Channel ID Missing");
}

async function loadChannel() {
    showLoading('Loading channel data…');
    
    // 1. Fetch sliv3.json
    let data = null;
    const sources = ['sliv3.json', '../api/sliv3.json', '/api/sliv3.json', 'https://allinonereborn2.online/sony/sliv3.json'];
    for (const src of sources) {
        try {
            const res = await fetch(src);
            if (res.ok) {
                data = await res.json();
                if (data && data[channelId]) break;
            }
        } catch (e) {}
    }

    const channelData = data ? data[channelId] : null;
    const chTitle = channelData?.title || channelData?.name || channelId.toUpperCase().replace(/-/g, ' ');
    document.getElementById('channelTitle').textContent = chTitle;
    document.title = chTitle + ' - YogiStream Live';

    // 2. Fetch cookie & JIO channels dataset
    let jstrChannels = [];
    let denChannels = [];
    let liveCookie = "";

    try {
      const cookieRes = await fetch('../api/cookies.json');
      if (cookieRes.ok) {
        const cdata = await cookieRes.json();
        const centry = Array.isArray(cdata) ? cdata.find(i => i.cookie) : null;
        if (centry?.cookie) liveCookie = centry.cookie;
      }
    } catch (e) {}

    try {
      const jstrRes = await fetch('../api/jstr4web.json');
      if (jstrRes.ok) jstrChannels = await jstrRes.json();
    } catch(e) {}

    try {
      const denRes = await fetch('../api/den-ww.json');
      if (denRes.ok) denChannels = await denRes.json();
    } catch(e) {}

    const mapping = SONY_JTV_MAPPING[channelId] || {};
    const jtvMatch = jstrChannels.find(ch => String(ch.id) === String(mapping.id) || (mapping.altName && ch.name === mapping.altName));
    const denMatch = denChannels.find(ch => String(ch.channel_id) === String(mapping.id) || (mapping.altName && ch.name === mapping.altName));

    const candidates = [];

    // Candidate 1: JIO DASH stream with ClearKey DRM
    if (jtvMatch?.url && (jtvMatch.keyId || denMatch?.drm)) {
      const drmMap = {};
      if (jtvMatch.keyId && jtvMatch.key) drmMap[jtvMatch.keyId] = jtvMatch.key;
      if (denMatch?.drm) Object.assign(drmMap, denMatch.drm);
      candidates.push({
        type: 'shaka',
        url: jtvMatch.url,
        drm: drmMap,
        token: liveCookie
      });
    }

    // Candidate 2: den-ww proxy MPD
    if (denMatch?.mpd) {
      candidates.push({
        type: 'shaka',
        url: denMatch.mpd,
        drm: denMatch.drm || {},
        token: denMatch.token || liveCookie
      });
    }

    // Candidate 3: direct HLS m3u8
    if (channelData?.m3u8) {
      const proxyUrl = "https://allinonereborn2.online/livtest3/stream_proxy.php?url=" + encodeURIComponent(channelData.m3u8);
      candidates.push({ type: 'hls', url: channelData.m3u8 });
      candidates.push({ type: 'hls', url: proxyUrl });
    }

    if (candidates.length === 0) {
      showError("Stream Unavailable", "No active stream available for " + chTitle);
      return;
    }

    tryPlayCandidates(candidates, 0, chTitle);
}

async function tryPlayCandidates(candidates, index, chTitle) {
  if (index >= candidates.length) {
    showError("Stream Offline", "Unable to load stream for " + chTitle + ". Please retry or select another channel.");
    return;
  }

  const cand = candidates[index];
  showLoading('Connecting stream server (' + (index + 1) + '/' + candidates.length + ')…');

  if (cand.type === 'shaka') {
    try {
      shaka.polyfill.installAll();
      if (shaka.Player.isBrowserSupported()) {
        const player = new shaka.Player();
        await player.attach(video);

        if (cand.drm && Object.keys(cand.drm).length > 0) {
          player.configure({ drm: { clearKeys: cand.drm } });
        }

        if (cand.token) {
          player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['Referer'] = "https://www.jiotv.com/";
            request.headers['User-Agent'] = "plaYtv/7.1.5";
            if (cand.token && (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT)) {
              if (request.uris[0] && !request.uris[0].includes('__hdnea__=')) {
                const sep = request.uris[0].includes('?') ? '&' : '?';
                request.uris[0] += sep + (cand.token.startsWith('__hdnea__=') ? cand.token : '__hdnea__=' + cand.token);
              }
            }
          });
        }

        await player.load(cand.url);
        video.play().catch(() => {});
        hideLoading();
        return;
      }
    } catch(err) {
      console.warn('Shaka candidate failed:', err);
    }
  }

  // Fallback to Hls.js
  if (Hls.isSupported()) {
    const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    hls.loadSource(cand.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      hideLoading();
      video.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        hls.destroy();
        tryPlayCandidates(candidates, index + 1, chTitle);
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = cand.url;
    video.onloadedmetadata = () => { hideLoading(); video.play().catch(() => {}); };
    video.onerror = () => tryPlayCandidates(candidates, index + 1, chTitle);
  } else {
    tryPlayCandidates(candidates, index + 1, chTitle);
  }
}

loadChannel();
</script>
<script src="../assets/security.js"></script>
</body>
</html>
