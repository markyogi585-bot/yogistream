<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>YogiStream - SonyLiv Live TV | @yogiprojects</title>
<script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: #000;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  color: #fff;
}
#player {
  width: 100vw;
  height: 100dvh;
  max-width: 100%;
  max-height: 100%;
  position: relative;
}
/* Top Header */
.player-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 16px 20px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: auto;
}
.back-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 1rem;
  backdrop-filter: blur(8px);
  transition: all 0.2s;
}
.back-btn:hover {
  background: #ff7700;
  color: #fff;
  transform: scale(1.05);
}
.channel-title-text {
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
.channel-badge {
  background: linear-gradient(90deg, #ff7700, #ff0055);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 20px;
  text-transform: uppercase;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}
.live-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 119, 0, 0.25);
  border: 1px solid rgba(255, 119, 0, 0.5);
  color: #ff9900;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}
.live-dot {
  width: 6px;
  height: 6px;
  background: #ff9900;
  border-radius: 50%;
  animation: pulseDot 1.2s infinite;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(1.3); }
}
.error-msg {
  color: #ff4757;
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>

<div class="player-header">
  <div class="header-left">
    <a href="index.html" class="back-btn" title="Back to Channels">
      <i class="fas fa-arrow-left"></i>
    </a>
    <div>
      <div id="channelTitle" class="channel-title-text">SonyLiv Live</div>
      <span class="channel-badge">HD STREAM</span>
    </div>
  </div>
  <div class="header-right">
    <div class="live-indicator">
      <div class="live-dot"></div>
      <span>LIVE</span>
    </div>
  </div>
</div>

<div id="player"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const channelId = urlParams.get('id');

if (!channelId) {
    document.body.innerHTML = '<h2 class="error-msg">Channel ID Missing (use ?id=sony-hd)</h2>';
    throw new Error("Channel ID Missing");
}

async function loadChannel() {
    let data = null;
    const sources = ['sliv3.json', '../api/sliv3.json', 'https://allinonereborn2.online/sony/sliv3.json'];
    for (const src of sources) {
        try {
            const res = await fetch(src);
            if (res.ok) {
                data = await res.json();
                if (data && data[channelId]) break;
            }
        } catch (e) {}
    }

    if (!data || !data[channelId] || !data[channelId].m3u8) {
        document.body.innerHTML = '<h2 class="error-msg">Channel or stream link not found for: ' + channelId + '</h2>';
        return;
    }

    const channelData = data[channelId];
    const chTitle = channelData.title || channelData.name || 'SonyLiv Channel';
    document.getElementById('channelTitle').textContent = chTitle;
    document.title = chTitle + ' - YogiStream Live';

    const originalM3u8 = channelData.m3u8;
    const proxyUrl = "https://allinonereborn2.online/livtest3/stream_proxy.php?url=" + encodeURIComponent(originalM3u8);
    
    initializePlayer(proxyUrl, originalM3u8);
}

function initializePlayer(videoUrl, rawUrl) {
    try {
        const player = jwplayer("player");
        player.setup({
            file: videoUrl,
            width: "100%",
            height: "100%",
            autostart: true,
            mute: false,
            primary: "html5",
            stretching: "uniform",
            controls: true,
            qualityLabels: false
        });

        player.on('error', function() {
            if (rawUrl && videoUrl !== rawUrl) {
                initializePlayer(rawUrl, null);
            } else {
                fallbackHLS(rawUrl || videoUrl);
            }
        });
    } catch(err) {
        fallbackHLS(rawUrl || videoUrl);
    }
}

function fallbackHLS(streamUrl) {
    const playerContainer = document.getElementById('player');
    playerContainer.innerHTML = '';
    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.objectFit = 'contain';
    playerContainer.appendChild(video);

    if (Hls.isSupported()) {
        const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(() => {});
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(() => {});
    }
}

loadChannel();
</script>
<script src="../assets/security.js"></script>
</body>
</html>
