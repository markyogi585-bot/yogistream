<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>YogiStream - SonyLiv Live TV | @yogiprojects</title>
<!-- Hls.js & Shaka Player -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: #000;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  color: #fff;
}
.player-container {
  width: 100vw;
  height: 100dvh;
  position: relative;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
/* Top Header */
.player-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 16px 20px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: auto;
}
.back-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 1rem;
  backdrop-filter: blur(8px);
  transition: all 0.2s;
}
.back-btn:hover {
  background: #ff7700;
  color: #fff;
  transform: scale(1.05);
}
.channel-title-text {
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
.channel-badge {
  background: linear-gradient(90deg, #ff7700, #ff0055);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 20px;
  text-transform: uppercase;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}
.live-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 119, 0, 0.25);
  border: 1px solid rgba(255, 119, 0, 0.5);
  color: #ff9900;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}
.live-dot {
  width: 6px;
  height: 6px;
  background: #ff9900;
  border-radius: 50%;
  animation: pulseDot 1.2s infinite;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(1.3); }
}

/* Loading & Error Overlays */
.loading-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.75);
  z-index: 15;
  gap: 12px;
  pointer-events: none;
}
.loading-overlay.hidden { display: none; }
.loader-spinner {
  width: 44px;
  height: 44px;
  border: 3px solid rgba(255, 119, 0, 0.2);
  border-top-color: #ff7700;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  font-size: 0.85rem;
  color: #d1d8e6;
  font-weight: 600;
}

.error-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}
.error-modal.hidden { display: none !important; }
.error-content {
  background: #181926;
  border-radius: 24px;
  padding: 30px;
  max-width: 480px;
  width: 90%;
  text-align: center;
  color: #f0f4ff;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  border: 1px solid rgba(255, 119, 0, 0.25);
}
.error-content h3 { 
  color: #ff9900; 
  margin-bottom: 14px;
  font-size: 1.35rem;
}
.error-content p {
  font-size: 0.95rem;
  line-height: 1.5;
  margin-bottom: 1.5rem;
  color: #b2c1e0;
}
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.modal-btn {
  padding: 10px 24px;
  border-radius: 40px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  border: none;
  transition: 0.2s;
}
.modal-btn.primary {
  background: linear-gradient(90deg, #ff7700, #ff0055);
  color: #fff;
}
.modal-btn.secondary {
  background: rgba(255,255,255,0.1);
  color: #fff;
}
</style>
</head>
<body>

<div class="player-header">
  <div class="header-left">
    <a href="index.html" class="back-btn" title="Back to Channels">
      <i class="fas fa-arrow-left"></i>
    </a>
    <div>
      <div id="channelTitle" class="channel-title-text">SonyLiv Live</div>
      <span class="channel-badge">HD STREAM</span>
    </div>
  </div>
  <div class="header-right">
    <div class="live-indicator">
      <div class="live-dot"></div>
      <span>LIVE</span>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loader-spinner"></div>
  <div class="loading-text" id="loadingText">Connecting to SonyLiv Stream…</div>
</div>

<div id="errorModal" class="error-modal hidden">
  <div class="error-content">
    <h3 id="errorTitle">Stream Notice</h3>
    <p id="errorMessage"></p>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="window.location.href='index.html'">Back to Channels</button>
      <button class="modal-btn primary" onclick="location.reload()">Retry Stream</button>
    </div>
  </div>
</div>

<div class="player-container">
  <video id="videoPlayer" controls autoplay playsinline preload="auto"></video>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const channelId = urlParams.get('id');

const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');
const errorModal = document.getElementById('errorModal');
const errorTitle = document.getElementById('errorTitle');
const errorMessage = document.getElementById('errorMessage');
const video = document.getElementById('videoPlayer');

function showLoading(msg) {
  if (loadingText) loadingText.textContent = msg || 'Connecting…';
  if (loadingOverlay) loadingOverlay.classList.remove('hidden');
}

function hideLoading() {
  if (loadingOverlay) loadingOverlay.classList.add('hidden');
}

function showError(title, msg) {
  hideLoading();
  if (errorTitle) errorTitle.textContent = title;
  if (errorMessage) errorMessage.innerHTML = msg;
  if (errorModal) errorModal.classList.remove('hidden');
}

if (!channelId) {
    showError("Channel Missing", "Channel ID missing in query params (?id=sony-hd)");
    throw new Error("Channel ID Missing");
}

async function loadChannel() {
    showLoading('Loading channel metadata…');
    let data = null;
    const sources = ['sliv3.json', '../api/sliv3.json', '/api/sliv3.json', 'https://allinonereborn2.online/sony/sliv3.json'];
    for (const src of sources) {
        try {
            const res = await fetch(src);
            if (res.ok) {
                data = await res.json();
                if (data && data[channelId]) break;
            }
        } catch (e) {}
    }

    if (!data || !data[channelId] || !data[channelId].m3u8) {
        showError("Channel Not Found", "Stream link not available for channel: <b>" + channelId + "</b>");
        return;
    }

    const channelData = data[channelId];
    const chTitle = channelData.title || channelData.name || 'SonyLiv Channel';
    document.getElementById('channelTitle').textContent = chTitle;
    document.title = chTitle + ' - YogiStream Live';

    const originalM3u8 = channelData.m3u8;
    const proxyUrl = "https://allinonereborn2.online/livtest3/stream_proxy.php?url=" + encodeURIComponent(originalM3u8);
    const miniProxyUrl = "https://mini.allinonereborn.site/events/stream_proxy.php?url=" + encodeURIComponent(originalM3u8);

    const candidates = [proxyUrl, originalM3u8, miniProxyUrl];
    playStreamWithFallback(candidates, 0);
}

function playStreamWithFallback(urls, index) {
    if (index >= urls.length) {
        showError("Stream Offline", "Unable to load live stream from available sources. Stream may be temporarily offline.");
        return;
    }

    const currentUrl = urls[index];
    showLoading('Connecting stream (' + (index + 1) + '/' + urls.length + ')…');

    if (Hls.isSupported()) {
        const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            manifestLoadingTimeOut: 10000,
            levelLoadingTimeOut: 10000
        });

        hls.loadSource(currentUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            hideLoading();
            video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, function(event, errData) {
            if (errData.fatal) {
                hls.destroy();
                playStreamWithFallback(urls, index + 1);
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = currentUrl;
        video.onloadedmetadata = function() {
            hideLoading();
            video.play().catch(() => {});
        };
        video.onerror = function() {
            playStreamWithFallback(urls, index + 1);
        };
    } else {
        video.src = currentUrl;
        video.play().catch(() => {});
        hideLoading();
    }
}

loadChannel();
</script>
<script src="../assets/security.js"></script>
</body>
</html>
