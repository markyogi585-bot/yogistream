<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>YogiStream - JioTV+ 900+ HD Live Channels | @yogiprojects</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.4);
      --secondary: #7928ca;
      --accent: #ff007a;
      --dark-bg: #06070a;
      --card-bg: rgba(14, 18, 32, 0.85);
      --text-muted: #8b9bb4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 0%, #101428 0%, #06070a 65%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Bar */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 9px 18px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: var(--primary);
      color: #000;
      transform: translateY(-2px);
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
    }
    .brand-title span {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .fav-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #ff005a;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .fav-btn.active {
      background: #ff005a;
      color: #fff;
    }
    .tg-pill {
      background: linear-gradient(90deg, #0088cc, #00c6ff);
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(0, 136, 204, 0.35);
      transition: transform 0.2s;
    }
    .tg-pill:hover { transform: scale(1.04); }

    /* Header Banner */
    .header-banner {
      max-width: 1400px;
      margin: 10px auto 25px;
      padding: 0 20px;
      width: 100%;
      text-align: center;
    }
    .banner-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: var(--primary);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .banner-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .banner-title span {
      background: linear-gradient(90deg, #00f0ff, #ff007a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .banner-sub {
      color: var(--text-muted);
      font-size: 0.96rem;
      max-width: 680px;
      margin: 0 auto;
    }

    /* Controls: Search & Categories */
    .controls-wrap {
      max-width: 1400px;
      margin: 0 auto 25px;
      padding: 0 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .search-box {
      background: rgba(19, 23, 40, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 40px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .search-box i { color: var(--primary); font-size: 1.1rem; }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.96rem;
      font-family: inherit;
      width: 100%;
    }
    .search-box input::placeholder { color: #627290; }

    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .category-pills::-webkit-scrollbar { display: none; }
    .pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .pill.active, .pill:hover {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: #000;
      border-color: transparent;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    /* Channel Cards Grid */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
      max-width: 1400px;
      margin: 0 auto 50px;
      padding: 0 20px;
      width: 100%;
    }

    .channel-card {
      background: linear-gradient(180deg, rgba(20, 26, 44, 0.85), rgba(11, 14, 25, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .channel-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 36px var(--primary-glow);
      border-color: rgba(0, 240, 255, 0.45);
    }

    .card-fav-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      z-index: 5;
      transition: all 0.2s;
    }
    .card-fav-btn.active {
      color: #ff005a;
      border-color: #ff005a;
    }

    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: linear-gradient(90deg, #ff005a, #ff7700);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }

    .card-logo-wrap {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      background: rgba(0,0,0,0.5);
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 12px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s;
    }
    .channel-card:hover .card-logo-wrap {
      transform: scale(1.08);
      border-color: var(--primary);
    }
    .card-logo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .card-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .card-meta {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .meta-tag {
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .play-action-btn {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 8px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .channel-card:hover .play-action-btn {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: #000;
      border-color: transparent;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .top-nav { padding: 14px 18px; }
      .banner-title { font-size: 1.7rem; }
      .channels-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 14px;
      }
      .card-logo-wrap { width: 68px; height: 68px; }
      .card-name { font-size: 0.92rem; }
      .card-meta { display: none; }
      .mobile-bottom-nav { display: flex; }
      body { padding-bottom: 75px; }
    }

    /* Mobile Bottom Sticky Navigation */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(8, 10, 18, 0.94);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 9999;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
    }
    .mob-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      transition: color 0.2s;
    }
    .mob-nav-item i { font-size: 1.2rem; }
    .mob-nav-item.active, .mob-nav-item:hover { color: var(--primary); }
  </style>
</head>

<body>

  <!-- Top Navigation -->
  <header class="top-nav">
    <div class="nav-left">
      <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
      <div class="brand-title">JioTV+ <span>900+ CH</span></div>
    </div>
    <div class="nav-right">
      <button class="fav-btn" id="favToggleBtn" onclick="toggleFavoritesView()">
        <i class="fas fa-heart"></i> <span id="favCount">0</span>
      </button>
      <a href="https://t.me/yogiprojects" target="_blank" rel="noopener noreferrer" class="tg-pill">
        <i class="fab fa-telegram-plane"></i> @yogiprojects
      </a>
    </div>
  </header>

  <!-- Banner -->
  <section class="header-banner">
    <div class="banner-badge"><i class="fas fa-tv"></i> 900+ INDIAN & GLOBAL LIVE FEEDS</div>
    <h1 class="banner-title">JioTV+ <span>Full HD Live Channels</span></h1>
    <p class="banner-sub">Stream Star, Sony, Colors, Zee, Sports, News, and Regional channels in 1080p Full HD with zero lag.</p>
  </section>

  <!-- Search & Filters -->
  <section class="controls-wrap">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="channelSearch" placeholder="Search 900+ JioTV channels (e.g. Colors, Star, Sony, Aaj Tak, Sports)..." oninput="renderChannels()">
    </div>

    <div class="category-pills" id="categoryPills">
      <button class="pill active" onclick="setCategory('all', this)">All Channels</button>
      <button class="pill" onclick="setCategory('Entertainment', this)">🎭 Entertainment</button>
      <button class="pill" onclick="setCategory('Movies', this)">🎬 Movies</button>
      <button class="pill" onclick="setCategory('Sports', this)">🏏 Sports</button>
      <button class="pill" onclick="setCategory('News', this)">📰 News</button>
      <button class="pill" onclick="setCategory('Music', this)">🎵 Music</button>
      <button class="pill" onclick="setCategory('Kids', this)">👶 Kids</button>
      <button class="pill" onclick="setCategory('Devotional', this)">🙏 Devotional</button>
    </div>
  </section>

  <!-- Channels Grid -->
  <main class="channels-grid" id="channelsContainer">
    <div class="loading-state">
      <i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary); margin-bottom:12px;"></i>
      <div>Loading 900+ JioTV Channels…</div>
    </div>
  </main>

  <script>
    let allChannels = [];
    let selectedCategory = 'all';
    let showFavoritesOnly = false;
    let favorites = JSON.parse(localStorage.getItem('yogistream_favs') || '[]');

    function updateFavCount() {
      document.getElementById('favCount').textContent = favorites.length;
    }

    function toggleFavorite(id, e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const idx = favorites.indexOf(String(id));
      if (idx === -1) {
        favorites.push(String(id));
      } else {
        favorites.splice(idx, 1);
      }
      localStorage.setItem('yogistream_favs', JSON.stringify(favorites));
      updateFavCount();
      renderChannels();
    }

    function toggleFavoritesView() {
      showFavoritesOnly = !showFavoritesOnly;
      const btn = document.getElementById('favToggleBtn');
      btn.classList.toggle('active', showFavoritesOnly);
      renderChannels();
    }

    async function loadJioChannels() {
      const sources = ['jstr4web.json', '../api/jstr4web.json', '/api/jstr4web.json', 'den-ww.json', '../api/den-ww.json'];
      let data = null;

      for (const src of sources) {
        try {
          const res = await fetch(src);
          if (res.ok) {
            data = await res.json();
            if (Array.isArray(data) && data.length > 0) break;
          }
        } catch(e) {}
      }

      if (Array.isArray(data)) {
        allChannels = data.map(c => ({
          id: String(c.id || c.channel_id || c.name),
          name: c.name || 'Live Channel',
          logo: c.logo || 'https://jiotv.catchup.cdn.jio.com/dare_images/images/ColorsHD.png',
          category: c.category || c.genre || 'Entertainment',
          language: c.language || 'Hindi',
          isHD: (c.name || '').includes('HD') || (c.url || '').includes('HD')
        }));
        updateFavCount();
        renderChannels();
      } else {
        document.getElementById('channelsContainer').innerHTML = '<div class="loading-state" style="color:#ff5555;">Could not load channels. Please refresh.</div>';
      }
    }

    function setCategory(cat, btn) {
      selectedCategory = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderChannels();
    }

    function renderChannels() {
      const q = (document.getElementById('channelSearch')?.value || '').toLowerCase().trim();
      const container = document.getElementById('channelsContainer');
      if (!container) return;

      const filtered = allChannels.filter(ch => {
        const matchesQ = !q || ch.name.toLowerCase().includes(q) || ch.id.toLowerCase().includes(q);
        const matchesCat = (selectedCategory === 'all') || (ch.category.toLowerCase().includes(selectedCategory.toLowerCase()));
        const matchesFav = !showFavoritesOnly || favorites.includes(ch.id);
        return matchesQ && matchesCat && matchesFav;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="loading-state">No channels match your search/filter.</div>';
        return;
      }

      // Display up to 300 channels at a time for buttery smooth rendering
      container.innerHTML = filtered.slice(0, 300).map(ch => {
        const isFav = favorites.includes(ch.id);
        const playUrl = `pworld.html?id=${encodeURIComponent(ch.id)}`;

        return `
          <a href="${playUrl}" class="channel-card">
            <button class="card-fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${ch.id}', event)" title="Favorite">
              <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
            </button>
            <span class="card-badge">${ch.isHD ? '1080P HD' : 'LIVE'}</span>
            <div class="card-logo-wrap">
              <img src="${ch.logo}" onerror="this.src='../assets/jiotv_plus.png'" alt="${ch.name}" loading="lazy">
            </div>
            <div class="card-name">${ch.name}</div>
            <div class="card-meta">
              <span class="meta-tag">${ch.category}</span>
              <span class="meta-tag">${ch.language}</span>
            </div>
            <div class="play-action-btn"><i class="fas fa-play"></i> Watch Now</div>
          </a>
        `;
      }).join('');
    }

  <!-- Mobile Bottom Sticky Navigation -->
  <nav class="mobile-bottom-nav">
    <a href="../index.html" class="mob-nav-item">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a href="index.html" class="mob-nav-item active">
      <i class="fas fa-tv"></i>
      <span>JioTV+</span>
    </a>
    <a href="../zee5/index.html" class="mob-nav-item">
      <i class="fas fa-film"></i>
      <span>Zee5</span>
    </a>
    <a href="../events/index.html" class="mob-nav-item">
      <i class="fas fa-baseball-ball"></i>
      <span>Sports</span>
    </a>
    <a href="../playlist.html" class="mob-nav-item">
      <i class="fas fa-list-ul"></i>
      <span>M3U</span>
    </a>
  </nav>

  <script src="../assets/security.js"></script>
</body>
</html>
