<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>YogiStream - JioTV+ India Player | @yogiprojects</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  background:#000;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui,sans-serif;
}

.shaka-video-container{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.channel-info{
  position:absolute;
  top:0;left:0;right:0;
  padding:12px 15px;
  background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);
  display:flex;
  align-items:center;
  z-index:10;
  pointer-events:none;
  display:none;
}

.channel-logo{
  width:38px;
  height:38px;
  border-radius:8px;
  margin-right:10px;
  object-fit:contain;
  background:#111;
}

.channel-name{
  color:#fff;
  font-size:17px;
  font-weight:600;
}

#status{
  display:none;
}

.watermark{
  position:absolute;
  bottom:60px;left:16px;
  z-index:9;
  font-size:11px;
  font-weight:700;
  color:rgba(255,255,255,.12);
  pointer-events:none;
  letter-spacing:.5px;
}
</style>
</head>

<body>

<div class="shaka-video-container" id="player-container">

  <div class="channel-info">
    <img id="channelLogo" class="channel-logo"
         onerror="this.style.display='none'">
    <div id="channelName" class="channel-name"></div>
  </div>

  <div id="status"></div>

  <!-- Video element -->
  <video id="video" autoplay playsinline preload="metadata"></video>

</div>

<script>

/* ── CONFIGURATION ── */
const CHANNELS_SOURCES = ["jstr4web.json", "../api/jstr4web.json", "/jstr4web.json", "https://jjtvxweb.pages.dev/jstr4web.json"];
const COOKIE_PRIMARY_SOURCES  = ["../api/cookies.json", "https://allinonereborn2.online/jstrweb2/cookies.json"];
const COOKIE_STAR_SOURCES = ["../api/star_cookie.json", "https://allinonereborn2.online/jtv-fetch/jstarcookie/cookie.json"];

/* ── FETCH CONFIG ── */
async function fetchConfig(){
  try{
    let channelList = [];
    for (const src of CHANNELS_SOURCES) {
      try {
        const channelRes = await fetch(src);
        if (channelRes.ok) {
          const channelText = await channelRes.text();
          const channelJson = channelText.trim().startsWith('[') ? channelText : '[' + channelText + ']';
          channelList = JSON.parse(channelJson);
          if (Array.isArray(channelList) && channelList.length > 0) break;
        }
      } catch (err) {}
    }

    const channelId   = new URLSearchParams(location.search).get("id");
    const channelData = channelList.find(c => String(c.id) === String(channelId));

    if(!channelData){
      return null;
    }

    /* ── COOKIE SYSTEM ── */
    let primaryCookie = "";
    let fallbackCookie = "";

    for (const starSrc of COOKIE_STAR_SOURCES) {
      try{
        const res = await fetch(starSrc);
        if (res.ok) {
          const data = await res.json();
          if(data && data.failed_results){
            for(const item of data.failed_results){
              if(String(item.channel_id) === String(channelId)){
                if(item.error_details && item.error_details.final_url){
                  const match = item.error_details.final_url.match(/__hdnea__=([^&]+)/);
                  if(match){
                    primaryCookie = '__hdnea__=' + match[1];
                    break;
                  }
                }
              }
            }
          }
          if (primaryCookie) break;
        }
      }catch(e){}
    }
    
    if(!primaryCookie){
      for (const pSrc of COOKIE_PRIMARY_SOURCES) {
        try{
          const res  = await fetch(pSrc);
          if (res.ok) {
            const data = await res.json();
            const entry = Array.isArray(data) ? data.find(i => i.cookie) : null;
            if(entry?.cookie) {
              primaryCookie = entry.cookie;
              break;
            }
          }
        }catch(e){}
      }
    }

    const streamUrls = [channelData.url, channelData.url1, channelData.url2, channelData.url3]
      .filter(Boolean)
      .map(u => u.replace('bpk-tv//','bpk-tv/'));

    return {
      channelData,
      streamUrls,
      primaryCookie,
      fallbackCookie
    };

  }catch(err){
    return null;
  }
}

/* ── MAIN ── */
document.addEventListener("DOMContentLoaded", async () => {

  const cfg = await fetchConfig();
  if(!cfg) return;

  const { channelData, streamUrls, primaryCookie, fallbackCookie } = cfg;

  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){
    return;
  }

  const videoEl   = document.getElementById("video");
  const container = document.getElementById("player-container");

  const player = new shaka.Player();
  await player.attach(videoEl);

  new shaka.ui.Overlay(player, container, videoEl);

  let activeCookie = "";

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers["Referer"]    = "https://www.jiotv.com/";
    request.headers["User-Agent"] = "plaYtv/7.1.5";

    if(activeCookie &&
      (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
       type === shaka.net.NetworkingEngine.RequestType.SEGMENT)){

      request.uris[0] = request.uris[0].split("?")[0] + "?" + activeCookie;
    }
  });

  const cookieRounds = [primaryCookie];
  if(fallbackCookie && fallbackCookie !== primaryCookie){
    cookieRounds.push(fallbackCookie);
  }

  let loaded = false;

  outer:
  for(let r = 0; r < cookieRounds.length; r++){
    activeCookie = cookieRounds[r];
    for(let i = 0; i < streamUrls.length; i++){
      try{
        await player.load(streamUrls[i]);
        videoEl.play();
        loaded = true;
        break outer;
      }catch(e){}
    }
  }

  if (channelData.name) {
    document.title = channelData.name + " - YogiStream";
  }

});
</script>

<script src="../assets/security.js"></script>
</body>
</html>
