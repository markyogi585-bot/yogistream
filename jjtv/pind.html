<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>YogiStream India Player | @yogiprojects</title>

  <!-- Shaka Player Core + UI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #fff;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* Floating Clean Top Bar */
    .player-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px 24px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }
    .back-btn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1.1rem;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #ff005a;
      color: #fff;
      transform: scale(1.08);
    }
    .channel-logo-img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: contain;
      background: rgba(0,0,0,0.6);
      padding: 3px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .channel-title-text {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .channel-badge {
      background: linear-gradient(90deg, #ff005a, #ff7700);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 0, 90, 0.25);
      border: 1px solid rgba(255, 0, 90, 0.5);
      color: #ff005a;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: #ff005a;
      border-radius: 50%;
      animation: pulseDot 1.2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    .unmute-banner {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(255, 0, 90, 0.4);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 25;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      animation: bounce 2s infinite;
    }
    .unmute-banner.hidden { display: none; }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 15;
      gap: 14px;
      pointer-events: none;
    }
    .loading-overlay.hidden { display: none; }
    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 3.5px solid rgba(255, 0, 90, 0.2);
      border-top-color: #ff005a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.9rem; color: #a4b3d8; font-weight: 700; }

    .error-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }
    .error-modal.hidden { display: none !important; }
    .error-content {
      background: #151624;
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      color: #f0f4ff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 0, 90, 0.3);
    }
    .error-content h3 { color: #ff005a; margin-bottom: 12px; font-size: 1.35rem; }
    .error-content p { font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.6rem; color: #a0b0d0; }
    .modal-actions { display: flex; gap: 12px; justify-content: center; }
    .modal-btn {
      padding: 11px 24px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }
    .modal-btn.primary { background: linear-gradient(90deg, #ff005a, #ff7700); color: #fff; }
    .modal-btn.secondary { background: rgba(255,255,255,0.12); color: #fff; }
    .modal-btn:hover { transform: scale(1.05); }
  </style>
</head>

<body>

  <div class="player-header">
    <div class="header-left">
      <a href="index.html" class="back-btn" title="Back to Channels">
        <i class="fas fa-arrow-left"></i>
      </a>
      <img id="channelLogo" class="channel-logo-img" src="../assets/jiotv_plus.png" onerror="this.src='../assets/jiotv_plus.png'" alt="Logo">
      <div>
        <div id="channelTitle" class="channel-title-text">YogiStream Live TV</div>
        <span class="channel-badge" id="streamTypeBadge">FAST STREAM</span>
      </div>
    </div>
    <div class="header-right">
      <div class="live-indicator">
        <div class="live-dot"></div>
        <span>LIVE</span>
      </div>
    </div>
  </div>

  <div class="unmute-banner hidden" id="unmuteBanner" onclick="enableAudio()">
    <i class="fas fa-volume-up"></i>
    <span>Click anywhere to Unmute Audio</span>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader-spinner"></div>
    <div class="loading-text" id="loadingText">Connecting to Live Stream…</div>
  </div>

  <div id="errorModal" class="error-modal hidden">
    <div class="error-content">
      <h3 id="errorTitle">Stream Notice</h3>
      <p id="errorMessage"></p>
      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="window.location.href='index.html'">Back to Channels</button>
        <button class="modal-btn primary" onclick="location.reload()">Retry Stream</button>
      </div>
    </div>
  </div>

  <div class="shaka-video-container" id="videoContainer" data-shaka-player data-shaka-controls>
    <video autoplay playsinline preload="auto"></video>
  </div>

  <script>
  let globalVideo = null;

  function enableAudio() {
    if (globalVideo) {
      globalVideo.muted = false;
      globalVideo.volume = 1.0;
    }
    const banner = document.getElementById('unmuteBanner');
    if (banner) banner.classList.add('hidden');
  }

  (function() {
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const channelTitleEl = document.getElementById('channelTitle');
    const channelLogoEl = document.getElementById('channelLogo');
    const unmuteBanner = document.getElementById('unmuteBanner');

    function showLoading(msg) {
      if (loadingText) loadingText.textContent = msg || 'Connecting to Live Stream…';
      if (loadingOverlay) loadingOverlay.classList.remove('hidden');
    }

    function hideLoading() {
      if (loadingOverlay) loadingOverlay.classList.add('hidden');
    }

    function showError(title, msg) {
      hideLoading();
      const modal = document.getElementById('errorModal');
      const titleEl = document.getElementById('errorTitle');
      const msgEl = document.getElementById('errorMessage');
      if (titleEl) titleEl.textContent = title;
      if (msgEl) msgEl.innerHTML = msg;
      if (modal) modal.classList.remove('hidden');
    }

    async function initApp() {
      showLoading('Fetching Channel Stream Config…');
      
      const urlParams = new URLSearchParams(window.location.search);
      const channelId = urlParams.get('id');

      if (!channelId) {
        showError('Channel ID Missing', 'Please select a valid channel from the list.');
        return;
      }

      let jstrChannels = [];
      let denChannels = [];

      try {
        const jstrSources = ['jstr4web.json', '../api/jstr4web.json', '/api/jstr4web.json', 'https://jjtvxweb.pages.dev/jstr4web.json'];
        for (const src of jstrSources) {
          try {
            const resp = await fetch(src);
            if (resp.ok) {
              jstrChannels = await resp.json();
              if (Array.isArray(jstrChannels) && jstrChannels.length > 0) break;
            }
          } catch (e) {}
        }
      } catch (e) {}

      try {
        const denSources = ['den-ww.json', '../api/den-ww.json', '/api/den-ww.json', 'https://jjtvxweb.pages.dev/den-ww.json'];
        for (const src of denSources) {
          try {
            const resp = await fetch(src);
            if (resp.ok) {
              denChannels = await resp.json();
              if (Array.isArray(denChannels) && denChannels.length > 0) break;
            }
          } catch (e) {}
        }
      } catch (e) {}

      const jstrMatch = jstrChannels.find(ch => String(ch.id) === String(channelId) || ch.name === channelId);
      const denMatch = denChannels.find(ch => String(ch.channel_id) === String(channelId));

      const chName = jstrMatch?.name || denMatch?.name || 'Channel ' + channelId;
      const chLogo = jstrMatch?.logo || denMatch?.logo || '../assets/jiotv_plus.png';

      if (channelTitleEl) channelTitleEl.textContent = chName;
      if (channelLogoEl) channelLogoEl.src = chLogo;
      document.title = chName + ' - YogiStream Live';

      let drmKeys = {};
      if (jstrMatch?.keyId && jstrMatch?.key) {
        drmKeys[jstrMatch.keyId] = jstrMatch.key;
      }
      if (denMatch?.drm && typeof denMatch.drm === 'object') {
        drmKeys = { ...drmKeys, ...denMatch.drm };
      }

      let liveCookie = "";
      try {
        const cresp = await fetch('../api/cookies.json');
        if (cresp.ok) {
          const cdata = await cresp.json();
          const centry = Array.isArray(cdata) ? cdata.find(i => i.cookie) : null;
          if (centry?.cookie) liveCookie = centry.cookie;
        }
      } catch(e) {}

      const candidateUrls = [];
      if (jstrMatch?.url) {
        candidateUrls.push({ url: jstrMatch.url, token: liveCookie });
      }
      if (denMatch?.mpd) {
        candidateUrls.push({ url: denMatch.mpd, token: denMatch.token || liveCookie });
      }
      if (jstrMatch?.url1) candidateUrls.push({ url: jstrMatch.url1, token: liveCookie });

      if (candidateUrls.length === 0) {
        showError('Stream Not Available', 'No stream sources found for ' + chName);
        return;
      }

      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        showError('Browser Unsupported', 'Your browser does not support Shaka Player.');
        return;
      }

      const video = document.querySelector('video');
      globalVideo = video;

      // Default Volume ON
      video.muted = false;
      video.volume = 1.0;
      video.autoplay = true;
      video.playsInline = true;

      const player = new shaka.Player();
      await player.attach(video);

      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: [
          'play_pause',
          'time_and_duration',
          'volume',
          'spacer',
          'quality',
          'fullscreen'
        ],
        addBigPlayButton: true,
        seekBarColors: {
          base: 'rgba(255,255,255,.2)',
          buffered: 'rgba(255,255,255,.4)',
          played: 'rgb(255, 0, 90)'
        }
      });

      const drmConfig = (drmKeys && Object.keys(drmKeys).length > 0)
        ? { clearKeys: drmKeys }
        : {};

      player.configure({
        drm: drmConfig,
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 20,
          rebufferingGoal: 4
        }
      });

      let currentReqConfig = candidateUrls[0];
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['Referer'] = "https://www.jiotv.com/";
        request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";

        if (currentReqConfig.token) {
          const cookieVal = currentReqConfig.token.startsWith('__hdnea__=') ? currentReqConfig.token : '__hdnea__=' + currentReqConfig.token;
          if (
            (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
             type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
            request.uris[0] &&
            !request.uris[0].includes('__hdnea__=')
          ) {
            const sep = request.uris[0].includes('?') ? '&' : '?';
            request.uris[0] += sep + cookieVal;
          }
        }
      });

      let streamLoaded = false;
      for (let i = 0; i < candidateUrls.length; i++) {
        currentReqConfig = candidateUrls[i];
        try {
          showLoading('Connecting stream server (' + (i + 1) + '/' + candidateUrls.length + ')…');
          await player.load(currentReqConfig.url);

          video.play().then(() => {
            hideLoading();
          }).catch(err => {
            video.muted = true;
            video.play().catch(() => {});
            hideLoading();
            if (unmuteBanner) unmuteBanner.classList.remove('hidden');
          });

          streamLoaded = true;
          break;
        } catch (err) {
          console.warn('Candidate failed:', err);
        }
      }

      if (!streamLoaded) {
        showError('Stream Offline', 'Could not load video manifest for ' + chName + '. Please retry or switch channel.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().catch((err) => {
        showError('Playback Error', err.message || 'Unexpected player error.');
      });
    });

    document.addEventListener('click', () => {
      enableAudio();
    }, { once: true });

  })();
  </script>
  
  <script src="../assets/security.js"></script>
</body>
</html>
