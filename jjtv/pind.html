<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="referrer" content="no-referrer">
  <title>YogiStream Ultra Fast Player | @yogiprojects</title>

  <!-- Shaka Player Core + UI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #fff;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* Minimal floating back button */
    .floating-back-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1rem;
      z-index: 30;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    .floating-back-btn:hover {
      background: #ff005a;
      transform: scale(1.08);
    }

    .unmute-banner {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(255, 0, 90, 0.5);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 25;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .unmute-banner.hidden { display: none; }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 15;
      gap: 12px;
      pointer-events: none;
    }
    .loading-overlay.hidden { display: none; }
    .loader-spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 0, 90, 0.2);
      border-top-color: #ff005a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <a href="index.html" class="floating-back-btn" title="Back to Channels">
    <i class="fas fa-arrow-left"></i>
  </a>

  <div class="unmute-banner hidden" id="unmuteBanner" onclick="enableAudio()">
    <i class="fas fa-volume-up"></i>
    <span>Tap anywhere to Unmute Audio</span>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader-spinner"></div>
  </div>

  <div class="shaka-video-container" id="player-container" data-shaka-player data-shaka-controls>
    <video id="video" autoplay playsinline preload="auto"></video>
  </div>

  <script>
  let globalVideo = document.getElementById('video');

  function enableAudio() {
    if (globalVideo) {
      globalVideo.muted = false;
      globalVideo.volume = 1.0;
    }
    const banner = document.getElementById('unmuteBanner');
    if (banner) banner.classList.add('hidden');
  }

  const channelId = new URLSearchParams(location.search).get("id") || "144";

  async function startFastPlayback() {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) return;

    const videoEl = document.getElementById("video");
    globalVideo = videoEl;

    // Default Unmuted
    videoEl.muted = false;
    videoEl.volume = 1.0;

    const container = document.getElementById("player-container");
    const player = new shaka.Player();
    await player.attach(videoEl);

    new shaka.ui.Overlay(player, container, videoEl);

    // Parallel fetch channel dataset + live cookies for instant load
    const [chRes, cookieRes, starCookieRes] = await Promise.allSettled([
      fetch('jstr4web.json').then(r => r.json()).catch(() => fetch('../api/jstr4web.json').then(r => r.json())),
      fetch('https://allinonereborn2.online/jstrweb2/cookies.json').then(r => r.json()).catch(() => fetch('../api/cookies.json').then(r => r.json())),
      fetch('https://allinonereborn2.online/jtv-fetch/jstarcookie/cookie.json').then(r => r.json()).catch(() => null)
    ]);

    let channelList = chRes.status === 'fulfilled' && chRes.value ? chRes.value : [];
    let primaryCookie = "";

    // Check Star Sports / specific channel cookie
    if (starCookieRes.status === 'fulfilled' && starCookieRes.value?.failed_results) {
      for (const item of starCookieRes.value.failed_results) {
        if (String(item.channel_id) === String(channelId)) {
          if (item.error_details?.final_url) {
            const match = item.error_details.final_url.match(/__hdnea__=([^&]+)/);
            if (match) {
              primaryCookie = '__hdnea__=' + match[1];
              break;
            }
          }
        }
      }
    }

    if (!primaryCookie && cookieRes.status === 'fulfilled' && cookieRes.value) {
      const cdata = cookieRes.value;
      const entry = Array.isArray(cdata) ? cdata.find(i => i.cookie) : null;
      if (entry?.cookie) primaryCookie = entry.cookie;
    }

    const channelData = channelList.find(c => String(c.id) === String(channelId) || c.name === channelId) || {
      id: channelId,
      url: `https://jiotvmblive.cdn.jio.com/bpk-tv/ColorsHD_MOB/WDVLive/index.mpd`,
      keyId: "5360e12d4bb2519a9148d1089a55908d",
      key: "7e8f500cef51595f3d43acafab1a8fb4"
    };

    document.title = (channelData.name || 'Colors HD') + ' - YogiStream Live';

    const drmMap = {};
    if (channelData.keyId && channelData.key) {
      drmMap[channelData.keyId] = channelData.key;
    }

    player.configure({
      drm: { clearKeys: drmMap },
      streaming: {
        lowLatencyMode: true,
        bufferingGoal: 2,
        rebufferingGoal: 0.5,
        inaccurateManifestTolerance: 0
      }
    });

    let activeCookie = primaryCookie;

    player.getNetworkingEngine().registerRequestFilter((type, request) => {
      request.headers["Referer"] = "https://www.jiotv.com/";
      request.headers["User-Agent"] = "plaYtv/7.1.5";

      if (
        activeCookie &&
        (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
         type === shaka.net.NetworkingEngine.RequestType.SEGMENT)
      ) {
        request.uris[0] = request.uris[0].split("?")[0] + "?" + activeCookie;
      }
    });

    const streamUrls = [channelData.url, channelData.url1, channelData.url2].filter(Boolean);

    for (let i = 0; i < streamUrls.length; i++) {
      try {
        await player.load(streamUrls[i]);
        videoEl.play().then(() => {
          document.getElementById('loadingOverlay')?.classList.add('hidden');
        }).catch(() => {
          videoEl.muted = true;
          videoEl.play().catch(() => {});
          document.getElementById('loadingOverlay')?.classList.add('hidden');
          document.getElementById('unmuteBanner')?.classList.remove('hidden');
        });
        break;
      } catch (err) {
        console.warn('Playback retry:', err);
      }
    }
  }

  document.addEventListener("DOMContentLoaded", startFastPlayback);
  document.addEventListener('click', () => { enableAudio(); }, { once: true });
  </script>
</body>
</html>
