<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>YogiStream - JioTV+ India Player | @yogiprojects</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  background:#000;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui,sans-serif;
}

.shaka-video-container{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.error-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

.error-modal.hidden { display: none !important; }

.error-content {
  background: #141828;
  border-radius: 20px;
  padding: 28px;
  max-width: 500px;
  width: 90%;
  text-align: center;
  color: #f0f4ff;
  box-shadow: 0 20px 45px rgba(0,0,0,0.6);
  border: 1px solid rgba(0, 229, 255, 0.25);
}

.error-content h3 { 
  color: #00e5ff; 
  margin-bottom: 15px;
  font-size: 1.4rem;
}

.error-content p {
  font-size: 0.95rem;
  line-height: 1.5;
  margin-bottom: 1.5rem;
  color: #b0c4de;
}

.close-btn {
  background: linear-gradient(90deg, #00e5ff, #7000ff);
  color: #000;
  border: none;
  padding: 10px 28px;
  border-radius: 40px;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.9rem;
}
</style>
</head>

<body>

<div id="errorModal" class="error-modal hidden">
  <div class="error-content">
    <h3 id="errorTitle">Stream Notice</h3>
    <p id="errorMessage"></p>
    <button class="close-btn" onclick="document.getElementById('errorModal').classList.add('hidden')">Close</button>
  </div>
</div>

<div class="shaka-video-container" id="player-container" data-shaka-player-container>
  <video id="video" autoplay playsinline preload="metadata" data-shaka-player></video>
</div>

<script>
function showError(title, msg) {
  const modal = document.getElementById('errorModal');
  const titleEl = document.getElementById('errorTitle');
  const msgEl = document.getElementById('errorMessage');
  if (titleEl) titleEl.textContent = title;
  if (msgEl) msgEl.innerHTML = msg;
  if (modal) modal.classList.remove('hidden');
}

/* ── CONFIGURATION & SOURCES ── */
const CHANNELS_SOURCES = [
  "jstr4web.json", 
  "../api/jstr4web.json", 
  "/api/jstr4web.json", 
  "https://jjtvxweb.pages.dev/jstr4web.json"
];

const COOKIE_PRIMARY_SOURCES = [
  "../api/cookies.json", 
  "/api/cookies.json", 
  "cookies.json", 
  "https://allinonereborn2.online/jstrweb2/cookies.json"
];

const COOKIE_STAR_SOURCES = [
  "../api/star_cookie.json", 
  "/api/star_cookie.json", 
  "star_cookie.json", 
  "https://allinonereborn2.online/jtv-fetch/jstarcookie/cookie.json"
];

/* ── FETCH CONFIG ── */
async function fetchConfig(){
  try{
    let channelList = [];
    for (const src of CHANNELS_SOURCES) {
      try {
        const channelRes = await fetch(src);
        if (channelRes.ok) {
          const channelText = await channelRes.text();
          const cleanText = channelText.trim().startsWith('[') ? channelText : '[' + channelText + ']';
          channelList = JSON.parse(cleanText);
          if (Array.isArray(channelList) && channelList.length > 0) break;
        }
      } catch (err) {}
    }

    const channelId = new URLSearchParams(location.search).get("id");
    if (!channelId) {
      showError("Channel ID Missing", "Please select a channel from the list.");
      return null;
    }

    const channelData = channelList.find(c => String(c.id) === String(channelId) || c.name === channelId);

    if(!channelData){
      showError("Channel Not Found", "No stream found for channel ID: " + channelId);
      return null;
    }

    /* ── COOKIE SYSTEM ── */
    let primaryCookie = "";

    for (const starSrc of COOKIE_STAR_SOURCES) {
      try{
        const res = await fetch(starSrc);
        if (res.ok) {
          const data = await res.json();
          if(data && data.failed_results){
            for(const item of data.failed_results){
              if(String(item.channel_id) === String(channelId)){
                if(item.error_details && item.error_details.final_url){
                  const match = item.error_details.final_url.match(/__hdnea__=([^&]+)/);
                  if(match){
                    primaryCookie = '__hdnea__=' + match[1];
                    break;
                  }
                }
              }
            }
          }
          if (primaryCookie) break;
        }
      }catch(e){}
    }
    
    if(!primaryCookie){
      for (const pSrc of COOKIE_PRIMARY_SOURCES) {
        try{
          const res = await fetch(pSrc);
          if (res.ok) {
            const data = await res.json();
            const entry = Array.isArray(data) ? data.find(i => i.cookie) : null;
            if(entry?.cookie) {
              primaryCookie = entry.cookie;
              break;
            }
          }
        }catch(e){}
      }
    }

    const streamUrls = [channelData.url, channelData.url1, channelData.url2, channelData.url3]
      .filter(Boolean)
      .map(u => u.replace('bpk-tv//','bpk-tv/'));

    return {
      channelData,
      streamUrls,
      primaryCookie
    };

  }catch(err){
    console.error("fetchConfig error", err);
    return null;
  }
}

/* ── MAIN ── */
document.addEventListener("DOMContentLoaded", async () => {
  const cfg = await fetchConfig();
  if(!cfg) return;

  const { channelData, streamUrls, primaryCookie } = cfg;

  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){
    showError("Unsupported Browser", "Shaka Player is not supported in this browser.");
    return;
  }

  const videoEl = document.getElementById("video");
  const container = document.getElementById("player-container");

  const player = new shaka.Player();
  await player.attach(videoEl);

  const ui = new shaka.ui.Overlay(player, container, videoEl);
  ui.configure({
    controlPanelElements: [
      'play_pause',
      'time_and_duration',
      'mute',
      'volume',
      'spacer',
      'quality',
      'language',
      'picture_in_picture',
      'fullscreen'
    ],
    addBigPlayButton: true,
    seekBarColors: {
      base: 'rgba(255,255,255,.2)',
      buffered: 'rgba(255,255,255,.4)',
      played: 'rgb(0,229,255)'
    }
  });

  // ClearKey DRM support
  const drmConfig = {};
  if (channelData.keyId && channelData.key) {
    drmConfig.clearKeys = {
      [channelData.keyId]: channelData.key
    };
  }

  player.configure({
    drm: drmConfig,
    streaming: {
      lowLatencyMode: true,
      bufferingGoal: 20,
      rebufferingGoal: 4
    }
  });

  let activeCookie = primaryCookie || "";

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers["Referer"] = "https://www.jiotv.com/";
    request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";

    if(activeCookie &&
      (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
       type === shaka.net.NetworkingEngine.RequestType.SEGMENT)){

      const sep = request.uris[0].includes('?') ? '&' : '?';
      if (!request.uris[0].includes('__hdnea__=')) {
        request.uris[0] += sep + activeCookie;
      }
    }
  });

  let loaded = false;
  for(let i = 0; i < streamUrls.length; i++){
    try{
      await player.load(streamUrls[i]);
      videoEl.play().catch(() => {});
      loaded = true;
      break;
    }catch(e){
      console.warn("Failed URL:", streamUrls[i], e);
    }
  }

  if (!loaded) {
    showError("Stream Load Error", "Could not load video manifest. Stream might be offline.");
  }

  if (channelData.name) {
    document.title = channelData.name + " - YogiStream";
  }
});
</script>

<script src="../assets/security.js"></script>
</body>
</html>
