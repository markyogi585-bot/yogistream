<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="referrer" content="no-referrer">
  <title>YogiStream Global Player | @yogiprojects</title>

  <!-- Shaka Player Core + UI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #fff;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* Floating Clean Top Bar */
    .player-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }
    .back-btn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #00f0ff;
      color: #000;
      transform: scale(1.08);
    }
    .channel-logo-img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: contain;
      background: rgba(0,0,0,0.6);
      padding: 2px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .channel-title-text {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .channel-badge {
      background: linear-gradient(90deg, #00f0ff, #7928ca);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 0, 90, 0.25);
      border: 1px solid rgba(255, 0, 90, 0.5);
      color: #ff005a;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      background: #ff005a;
      border-radius: 50%;
      animation: pulseDot 1.2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    .unmute-banner {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 25;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      animation: bounce 2s infinite;
    }
    .unmute-banner.hidden { display: none; }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 15;
      gap: 14px;
      pointer-events: none;
    }
    .loading-overlay.hidden { display: none; }
    .loader-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-top-color: #00f0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.88rem; color: #a4b3d8; font-weight: 700; }

    .error-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }
    .error-modal.hidden { display: none !important; }
    .error-content {
      background: #111422;
      border-radius: 24px;
      padding: 30px 24px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      color: #f0f4ff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }
    .error-content h3 { color: #00f0ff; margin-bottom: 12px; font-size: 1.3rem; }
    .error-content p { font-size: 0.92rem; line-height: 1.5; margin-bottom: 1.5rem; color: #a0b0d0; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-btn {
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }
    .modal-btn.primary { background: linear-gradient(90deg, #00f0ff, #7928ca); color: #000; }
    .modal-btn.secondary { background: rgba(255,255,255,0.12); color: #fff; }
  </style>
</head>

<body>

  <div class="player-header">
    <div class="header-left">
      <a href="index.html" class="back-btn" title="Back to Channels">
        <i class="fas fa-arrow-left"></i>
      </a>
      <img id="channelLogo" class="channel-logo-img" src="../assets/jiotv_plus.png" onerror="this.src='../assets/jiotv_plus.png'" alt="Logo">
      <div>
        <div id="channelTitle" class="channel-title-text">YogiStream Live TV</div>
        <span class="channel-badge" id="streamTypeBadge">1080P HD</span>
      </div>
    </div>
    <div class="header-right">
      <div class="live-indicator">
        <div class="live-dot"></div>
        <span>LIVE</span>
      </div>
    </div>
  </div>

  <div class="unmute-banner hidden" id="unmuteBanner" onclick="enableAudio()">
    <i class="fas fa-volume-up"></i>
    <span>Click anywhere to Unmute Audio</span>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader-spinner"></div>
    <div class="loading-text" id="loadingText">Connecting to Live Stream…</div>
  </div>

  <div id="errorModal" class="error-modal hidden">
    <div class="error-content">
      <h3 id="errorTitle">Stream Notice</h3>
      <p id="errorMessage"></p>
      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="window.location.href='index.html'">Back to Channels</button>
        <button class="modal-btn primary" onclick="location.reload()">Retry Stream</button>
      </div>
    </div>
  </div>

  <div class="shaka-video-container" id="player-container" data-shaka-player data-shaka-controls>
    <video id="video" autoplay playsinline preload="metadata"></video>
  </div>

  <script>
  let globalVideo = document.getElementById('video');

  function enableAudio() {
    if (globalVideo) {
      globalVideo.muted = false;
      globalVideo.volume = 1.0;
    }
    const banner = document.getElementById('unmuteBanner');
    if (banner) banner.classList.add('hidden');
  }

  const DEN_SOURCES = ["den-ww.json", "../api/den-ww.json", "/api/den-ww.json", "https://jjtvxweb.pages.dev/den-ww.json"];
  const JSTR_SOURCES = ["jstr4web.json", "../api/jstr4web.json", "/api/jstr4web.json", "https://jjtvxweb.pages.dev/jstr4web.json"];
  const COOKIE_PRIMARY = "https://allinonereborn2.online/jstrweb2/cookies.json";
  const COOKIE_STAR_SPORTS = "https://allinonereborn2.online/jtv-fetch/jstarcookie/cookie.json";

  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const channelTitleEl = document.getElementById('channelTitle');
  const channelLogoEl = document.getElementById('channelLogo');
  const unmuteBanner = document.getElementById('unmuteBanner');

  function showLoading(msg) {
    if (loadingText) loadingText.textContent = msg || 'Connecting…';
    if (loadingOverlay) loadingOverlay.classList.remove('hidden');
  }

  function hideLoading() {
    if (loadingOverlay) loadingOverlay.classList.add('hidden');
  }

  function showError(title, msg) {
    hideLoading();
    const modal = document.getElementById('errorModal');
    const titleEl = document.getElementById('errorTitle');
    const msgEl = document.getElementById('errorMessage');
    if (titleEl) titleEl.textContent = title;
    if (msgEl) msgEl.innerHTML = msg;
    if (modal) modal.classList.remove('hidden');
  }

  async function fetchConfig() {
    const channelId = new URLSearchParams(location.search).get("id");
    if (!channelId) {
      showError("Channel Missing", "Please specify channel ID (?id=...)");
      return null;
    }

    let denChannels = [];
    let jstrChannels = [];

    for (const src of DEN_SOURCES) {
      try {
        const res = await fetch(src);
        if (res.ok) {
          denChannels = await res.json();
          if (Array.isArray(denChannels) && denChannels.length > 0) break;
        }
      } catch (e) {}
    }

    for (const src of JSTR_SOURCES) {
      try {
        const res = await fetch(src);
        if (res.ok) {
          jstrChannels = await res.json();
          if (Array.isArray(jstrChannels) && jstrChannels.length > 0) break;
        }
      } catch (e) {}
    }

    const denMatch = denChannels.find(ch => String(ch.channel_id) === String(channelId));
    const jstrMatch = jstrChannels.find(ch => String(ch.id) === String(channelId) || ch.name === channelId);

    if (!denMatch && !jstrMatch) {
      showError("Channel Not Found", "Channel not found for ID: " + channelId);
      return null;
    }

    const chName = denMatch?.name || jstrMatch?.name || 'Channel ' + channelId;
    const chLogo = denMatch?.logo || jstrMatch?.logo || '../assets/jiotv_plus.png';

    if (channelTitleEl) channelTitleEl.textContent = chName;
    if (channelLogoEl) channelLogoEl.src = chLogo;
    document.title = chName + ' - YogiStream Live';

    let primaryCookie = "";

    try {
      const res = await fetch(COOKIE_STAR_SPORTS);
      if (res.ok) {
        const data = await res.json();
        if (data && data.failed_results) {
          for (const item of data.failed_results) {
            if (String(item.channel_id) === String(channelId)) {
              if (item.error_details && item.error_details.final_url) {
                const match = item.error_details.final_url.match(/__hdnea__=([^&]+)/);
                if (match) {
                  primaryCookie = '__hdnea__=' + match[1];
                  break;
                }
              }
            }
          }
        }
      }
    } catch(e) {}

    if (!primaryCookie) {
      try {
        const res = await fetch(COOKIE_PRIMARY);
        if (res.ok) {
          const data = await res.json();
          const entry = Array.isArray(data) ? data.find(i => i.cookie) : null;
          if (entry?.cookie) primaryCookie = entry.cookie;
        }
      } catch(e) {}
    }

    if (!primaryCookie) {
      try {
        const res = await fetch('../api/cookies.json');
        if (res.ok) {
          const data = await res.json();
          const entry = Array.isArray(data) ? data.find(i => i.cookie) : null;
          if (entry?.cookie) primaryCookie = entry.cookie;
        }
      } catch(e) {}
    }

    const drmKeys = {};
    if (denMatch?.drm) Object.assign(drmKeys, denMatch.drm);
    if (jstrMatch?.keyId && jstrMatch?.key) drmKeys[jstrMatch.keyId] = jstrMatch.key;

    const candidateUrls = [];
    if (denMatch?.mpd) candidateUrls.push(denMatch.mpd);
    if (jstrMatch?.url) candidateUrls.push(jstrMatch.url);
    if (jstrMatch?.url1) candidateUrls.push(jstrMatch.url1);

    return {
      chName,
      candidateUrls,
      drmKeys,
      primaryCookie
    };
  }

  document.addEventListener("DOMContentLoaded", async () => {
    showLoading('Loading channel config…');
    const cfg = await fetchConfig();
    if (!cfg) return;

    const { chName, candidateUrls, drmKeys, primaryCookie } = cfg;

    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      showError("Browser Unsupported", "Your browser does not support Shaka Player.");
      return;
    }

    const videoEl = document.getElementById("video");
    globalVideo = videoEl;

    videoEl.muted = false;
    videoEl.volume = 1.0;

    const container = document.getElementById("player-container");
    const player = new shaka.Player();
    await player.attach(videoEl);

    new shaka.ui.Overlay(player, container, videoEl);

    player.configure({
      drm: { clearKeys: drmKeys },
      streaming: {
        lowLatencyMode: true,
        bufferingGoal: 20,
        rebufferingGoal: 4
      }
    });

    let activeCookie = primaryCookie;

    player.getNetworkingEngine().registerRequestFilter((type, request) => {
      request.headers["Referer"] = "https://www.jiotv.com/";
      request.headers["User-Agent"] = "plaYtv/7.1.5";

      if (
        activeCookie &&
        (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
         type === shaka.net.NetworkingEngine.RequestType.SEGMENT)
      ) {
        request.uris[0] = request.uris[0].split("?")[0] + "?" + activeCookie;
      }
    });

    let loaded = false;
    for (let i = 0; i < candidateUrls.length; i++) {
      try {
        showLoading('Connecting stream server (' + (i + 1) + '/' + candidateUrls.length + ')…');
        await player.load(candidateUrls[i]);
        videoEl.play().then(() => {
          hideLoading();
        }).catch(() => {
          videoEl.muted = true;
          videoEl.play().catch(() => {});
          hideLoading();
          if (unmuteBanner) unmuteBanner.classList.remove('hidden');
        });

        loaded = true;
        break;
      } catch (e) {
        console.warn('Candidate failed:', candidateUrls[i], e);
      }
    }

    if (!loaded) {
      showError("Stream Offline", "Could not load video manifest for " + chName + ". Please retry or switch channel.");
    }
  });

  document.addEventListener('click', () => {
    enableAudio();
  }, { once: true });
  </script>
  
  <script src="../assets/security.js"></script>
</body>
</html>
