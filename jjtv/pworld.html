<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="referrer" content="no-referrer">
  <title>YogiStream Global Live TV | @yogiprojects</title>

  <!-- Shaka Player Core + UI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #fff;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* Floating Clean Top Bar with Auto-Hide */
    .player-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .player-header.hidden { opacity: 0; pointer-events: none; }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }
    .back-btn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #00f0ff;
      color: #000;
      transform: scale(1.08);
    }
    .channel-logo-img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: contain;
      background: rgba(0,0,0,0.6);
      padding: 2px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .channel-title-text {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .channel-badge {
      background: linear-gradient(90deg, #00f0ff, #7928ca);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 0, 90, 0.25);
      border: 1px solid rgba(255, 0, 90, 0.5);
      color: #ff005a;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      background: #ff005a;
      border-radius: 50%;
      animation: pulseDot 1.2s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    .unmute-banner {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 25;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      animation: bounce 2s infinite;
    }
    .unmute-banner.hidden { display: none; }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }
  </style>
</head>

<body>

  <div class="player-header" id="playerHeader">
    <div class="header-left">
      <a href="/jjtv" class="back-btn" title="Back to Channels">
        <i class="fas fa-arrow-left"></i>
      </a>
      <img id="channelLogo" class="channel-logo-img" src="../assets/jiotv_plus.png" onerror="this.src='../assets/jiotv_plus.png'" alt="Logo">
      <div>
        <div id="channelTitle" class="channel-title-text">YogiStream Live</div>
        <span class="channel-badge">1080P PRO</span>
      </div>
    </div>
    <div class="header-right">
      <div class="live-indicator">
        <div class="live-dot"></div>
        <span>LIVE</span>
      </div>
    </div>
  </div>

  <div class="unmute-banner hidden" id="unmuteBanner" onclick="enableAudio()">
    <i class="fas fa-volume-up"></i>
    <span>Click anywhere to Unmute Audio</span>
  </div>

  <div class="shaka-video-container" id="player-container" data-shaka-player data-shaka-controls>
    <video id="video" autoplay playsinline preload="auto"></video>
  </div>

  <script>
  let globalVideo = document.getElementById('video');
  let hideTimer = null;

  function resetHideTimer() {
    const h = document.getElementById('playerHeader');
    if (h) h.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (h) h.classList.add('hidden');
    }, 4000);
  }

  document.addEventListener('mousemove', resetHideTimer);
  document.addEventListener('touchstart', resetHideTimer);

  function enableAudio() {
    if (globalVideo) {
      globalVideo.muted = false;
      globalVideo.volume = 1.0;
    }
    const banner = document.getElementById('unmuteBanner');
    if (banner) banner.classList.add('hidden');
  }

  function fetchWithTimeout(url, ms = 1200) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), ms);
    return fetch(url, { signal: controller.signal })
      .then(res => { clearTimeout(timeout); return res.json(); })
      .catch(() => { clearTimeout(timeout); return null; });
  }

  const channelId = new URLSearchParams(location.search).get("id") || "144";
  const channelTitleEl = document.getElementById('channelTitle');
  const channelLogoEl = document.getElementById('channelLogo');

  async function startFastPlayback() {
    resetHideTimer();

    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) return;

    const videoEl = document.getElementById("video");
    globalVideo = videoEl;

    // Default Unmuted
    videoEl.muted = false;
    videoEl.volume = 1.0;

    const container = document.getElementById("player-container");
    const player = new shaka.Player();
    await player.attach(videoEl);

    new shaka.ui.Overlay(player, container, videoEl);

    player.configure({
      abr: {
        enabled: true,
        defaultBandwidthEstimate: 400000
      },
      streaming: {
        lowLatencyMode: true,
        bufferingGoal: 1.0,
        rebufferingGoal: 0.2,
        bufferBehind: 5,
        inaccurateManifestTolerance: 0,
        retryParameters: {
          maxAttempts: 4,
          baseDelay: 100,
          backoffFactor: 1.1
        }
      }
    });

    // Parallel fetch channel dataset + cookies
    const [jstrData, starData, cookieData] = await Promise.all([
      fetchWithTimeout('jstr4web.json').then(d => d || fetchWithTimeout('/api/jstr4web.json')).then(d => d || fetchWithTimeout('../api/jstr4web.json')),
      fetchWithTimeout('https://allinonereborn2.online/jtv-fetch/jstarcookie/cookie.json'),
      fetchWithTimeout('https://allinonereborn2.online/jstrweb2/cookies.json').then(d => d || fetchWithTimeout('/api/cookies.json'))
    ]);

    let primaryCookie = "";
    if (starData?.failed_results) {
      for (const item of starData.failed_results) {
        if (String(item.channel_id) === String(channelId) && item.error_details?.final_url) {
          const match = item.error_details.final_url.match(/__hdnea__=([^&]+)/);
          if (match) {
            primaryCookie = '__hdnea__=' + match[1];
            break;
          }
        }
      }
    }

    if (!primaryCookie && cookieData) {
      const entry = Array.isArray(cookieData) ? cookieData.find(i => i.cookie) : null;
      if (entry?.cookie) primaryCookie = entry.cookie;
    }

    let channelData = null;
    if (Array.isArray(jstrData)) {
      channelData = jstrData.find(c => String(c.id) === String(channelId) || c.name === channelId);
    }

    if (!channelData) {
      channelData = {
        name: 'Channel ' + channelId,
        url: `https://jiotvmblive.cdn.jio.com/bpk-tv/ColorsHD_MOB/WDVLive/index.mpd`,
        keyId: "5360e12d4bb2519a9148d1089a55908d",
        key: "7e8f500cef51595f3d43acafab1a8fb4"
      };
    }

    if (channelTitleEl) channelTitleEl.textContent = channelData.name || 'Live Channel';
    if (channelLogoEl && channelData.logo) channelLogoEl.src = channelData.logo;
    document.title = (channelData.name || 'Live Channel') + ' - YogiStream';

    const drmConfig = {};
    if (channelData.keyId && channelData.key) {
      drmConfig[channelData.keyId] = channelData.key;
    }
    player.configure({ drm: { clearKeys: drmConfig } });

    let activeCookie = primaryCookie;

    player.getNetworkingEngine().registerRequestFilter((type, request) => {
      if (
        activeCookie &&
        (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
         type === shaka.net.NetworkingEngine.RequestType.SEGMENT)
      ) {
        if (request.uris[0] && !request.uris[0].includes('__hdnea__=')) {
          const sep = request.uris[0].includes('?') ? '&' : '?';
          request.uris[0] += sep + activeCookie;
        }
      }
    });

    const streamUrls = [channelData.url, channelData.url1, channelData.url2].filter(Boolean);

    for (let i = 0; i < streamUrls.length; i++) {
      try {
        await player.load(streamUrls[i]);
        videoEl.play().catch(() => {
          videoEl.muted = true;
          videoEl.play().catch(() => {});
          document.getElementById('unmuteBanner')?.classList.remove('hidden');
        });
        break;
      } catch (err) {
        try {
          const proxyUrl = `/api/proxy?url=${encodeURIComponent(streamUrls[i])}`;
          await player.load(proxyUrl);
          videoEl.play().catch(() => {});
          break;
        } catch(err2) {}
      }
    }
  }

  document.addEventListener("DOMContentLoaded", startFastPlayback);
  document.addEventListener('click', () => { enableAudio(); }, { once: true });
  </script>
  <script src="../assets/security.js"></script>
</body>
</html>
