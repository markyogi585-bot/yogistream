<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>YogiStream - JioTV+ Worldwide Player | @yogiprojects</title>

  <!-- Shaka Player Core + UI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    .error-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .error-modal.hidden { display: none !important; }

    .error-content {
      background: #141828;
      border-radius: 20px;
      padding: 28px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      color: #f0f4ff;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      border: 1px solid rgba(0, 229, 255, 0.25);
    }

    .error-content h3 { 
      color: #00e5ff; 
      margin-bottom: 15px;
      font-size: 1.4rem;
      letter-spacing: -0.3px;
    }
    
    .error-content p {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
      color: #b0c4de;
    }

    .close-btn {
      background: linear-gradient(90deg, #00e5ff, #7000ff);
      color: #000;
      border: none;
      padding: 10px 28px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .close-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }
  </style>
</head>

<body>

  <div id="errorModal" class="error-modal hidden">
    <div class="error-content">
      <h3 id="errorTitle">YogiStream Notice</h3>
      <p id="errorMessage"></p>
      <button class="close-btn" onclick="document.getElementById('errorModal').classList.add('hidden')">Close</button>
    </div>
  </div>

  <div class="shaka-video-container" data-shaka-player data-shaka-controls>
    <video autoplay muted playsinline preload="metadata"></video>
  </div>

  <script>
  (function() {
    function showError(title, msg) {
      const modal = document.getElementById('errorModal');
      const titleEl = document.getElementById('errorTitle');
      const msgEl = document.getElementById('errorMessage');
      if (titleEl) titleEl.textContent = title;
      if (msgEl) msgEl.innerHTML = msg;
      if (modal) modal.classList.remove('hidden');
    }

    async function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const channelId = urlParams.get('id');

      if (!channelId) {
        showError('Channel ID Missing', 'Please select a channel from the channel list.');
        return;
      }

      // Step 1: Fetch channel dataset (local first, then remote fallback)
      let channels = [];
      const sources = [
        'den-ww.json', 
        '../api/den-ww.json', 
        '/api/den-ww.json', 
        'https://jjtvxweb.pages.dev/den-ww.json'
      ];
      
      for (const src of sources) {
        try {
          const resp = await fetch(src);
          if (resp.ok) {
            channels = await resp.json();
            if (Array.isArray(channels) && channels.length > 0) break;
          }
        } catch (e) {}
      }

      let channel = channels.find(ch => String(ch.channel_id) === String(channelId));

      // Fallback to jstr4web.json if not in den-ww.json
      if (!channel) {
        const jstrSources = ['jstr4web.json', '../api/jstr4web.json', '/api/jstr4web.json', 'https://jjtvxweb.pages.dev/jstr4web.json'];
        for (const jsrc of jstrSources) {
          try {
            const jresp = await fetch(jsrc);
            if (jresp.ok) {
              const jdata = await jresp.json();
              if (Array.isArray(jdata)) {
                const found = jdata.find(c => String(c.id) === String(channelId) || c.name === channelId);
                if (found) {
                  channel = {
                    name: found.name,
                    channel_id: found.id,
                    mpd: found.url,
                    drm: (found.keyId && found.key) ? { [found.keyId]: found.key } : null,
                    referer: "https://www.jiotv.com/",
                    userAgent: "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6"
                  };
                  break;
                }
              }
            }
          } catch(e) {}
        }
      }

      if (!channel) {
        showError('Channel Not Found', `No stream data found for channel ID: ${channelId}`);
        return;
      }

      if (!channel.mpd || channel.mpd.trim() === '') {
        showError('Stream Notice', `${channel.name || 'Channel'}<br>Live stream manifest is currently not available.`);
        return;
      }

      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        showError('Browser Not Supported', 'Your browser does not support Shaka Player.');
        return;
      }

      const video = document.querySelector('video');
      video.muted = true;
      video.autoplay = true;
      video.playsInline = true;
      video.style.display = 'block';

      const player = new shaka.Player(video);
      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: [
          'play_pause',
          'time_and_duration',
          'mute',
          'volume',
          'spacer',
          'quality',
          'language',
          'picture_in_picture',
          'fullscreen'
        ],
        addBigPlayButton: true,
        seekBarColors: {
          base: 'rgba(255,255,255,.2)',
          buffered: 'rgba(255,255,255,.4)',
          played: 'rgb(0,229,255)'
        }
      });

      const drmConfig = channel.drm && Object.keys(channel.drm).length > 0
        ? { clearKeys: channel.drm }
        : {};

      player.configure({
        drm: drmConfig,
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 20,
          rebufferingGoal: 4,
          bufferBehind: 30,
          ignoreTextStreamFailures: true,
          alwaysStreamText: false
        }
      });

      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        if (channel.referer) request.headers['Referer'] = channel.referer;
        request.headers['User-Agent'] = channel.userAgent || "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";

        if (channel.token) {
          request.headers['Cookie'] = channel.token;
          if (
            (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
             type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
            request.uris[0] &&
            !request.uris[0].includes('__hdnea__=')
          ) {
            const sep = request.uris[0].includes('?') ? '&' : '?';
            request.uris[0] += sep + channel.token;
          }
        }
      });

      try {
        await player.load(channel.mpd);
        document.title = (channel.name || 'Live TV') + ' - YogiStream';
      } catch (err) {
        console.error('Shaka player load error', err);
        showError('Stream Playback Error', err.message || 'Unable to play stream.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp().catch((err) => {
        showError('Playback Error', err.message || 'Unexpected player error.');
      });
    });
  })();
  </script>
  
  <script src="../assets/security.js"></script>
</body>
</html>
